<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>SWAT Raiders™</title>
<style>
  :root{
    --bg:#0a0d12; --panel:#141a23; --panel2:#1b232f; --line:#2a3546;
    --txt:#dfe7f2; --dim:#8ba0bb; --acc:#3fa9ff; --gold:#ffcc4d;
    --red:#ff4d5e; --grn:#4ade80; --pur:#b17dff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:radial-gradient(1200px 700px at 50% -10%,#16202e,#070a0e 70%);
    color:var(--txt); font-family:"Segoe UI",system-ui,-apple-system,sans-serif;
    display:flex; align-items:center; justify-content:center; padding:14px;
  }
  #app{display:flex; gap:12px; align-items:flex-start; max-width:1400px; width:100%}
  #stage{position:relative; flex:0 0 auto}
  canvas{
    display:block; border:2px solid var(--line); border-radius:10px;
    background:#1a2a1d; box-shadow:0 18px 60px rgba(0,0,0,.6); cursor:crosshair;
    max-width:100%; height:auto;
  }
  /* ---------- top HUD ---------- */
  #hud{
    display:flex; gap:10px; align-items:center; margin-bottom:8px; flex-wrap:wrap;
    background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:8px 10px;
  }
  .stat{display:flex; flex-direction:column; line-height:1.1; min-width:74px}
  .stat b{font-size:17px}
  .stat span{font-size:10px; letter-spacing:.14em; color:var(--dim); text-transform:uppercase}
  .grow{flex:1}
  button{
    font:inherit; color:var(--txt); background:var(--panel2); border:1px solid var(--line);
    padding:7px 11px; border-radius:7px; cursor:pointer; transition:.12s;
  }
  button:hover:not(:disabled){background:#243046; border-color:#3d5a80}
  button:disabled{opacity:.4; cursor:not-allowed}
  button.on{background:var(--acc); border-color:var(--acc); color:#06121e; font-weight:700}
  button.go{background:linear-gradient(180deg,#2f7d4f,#1e5c39); border-color:#3aa363; font-weight:700}
  button.go:hover:not(:disabled){background:linear-gradient(180deg,#39a064,#26744a)}
  button.sell{background:#4a1f26; border-color:#7d3140}
  /* ---------- sidebar ---------- */
  #side{width:330px; flex:0 0 330px; display:flex; flex-direction:column; gap:10px}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px}
  .card h3{margin:0 0 8px; font-size:11px; letter-spacing:.18em; color:var(--dim); text-transform:uppercase}
  .shop{display:flex; flex-direction:column; gap:6px}
  .tw{
    display:flex; gap:9px; align-items:center; text-align:left; padding:7px 9px; width:100%;
  }
  .tw .ic{width:32px;height:32px;flex:0 0 32px;border-radius:6px;display:grid;place-items:center;font-size:15px;background:#0c1119;border:1px solid var(--line);overflow:hidden}
  .tw .ic svg,#selBody .ic svg{display:block}
  .tw .nm{font-weight:600; font-size:13px}
  .tw .ds{font-size:10.5px; color:var(--dim); line-height:1.25}
  .tw .pr{margin-left:auto; color:var(--gold); font-weight:700; font-size:12.5px; white-space:nowrap}
  .tw.poor .pr{color:var(--red)}
  .tw.sel{border-color:var(--acc); background:#182636}
  .up{display:flex; gap:8px; align-items:flex-start; text-align:left; width:100%; padding:6px 8px; margin-bottom:5px}
  .up .t{font-size:12px;font-weight:600}
  .up .d{font-size:10.5px;color:var(--dim);line-height:1.25}
  .up .c{margin-left:auto;color:var(--gold);font-weight:700;font-size:12px;white-space:nowrap}
  .pathhdr{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--acc);margin:6px 0 4px}
  .pips{display:inline-flex;gap:3px;margin-left:6px;vertical-align:middle}
  .pip{width:7px;height:7px;border-radius:2px;background:#2b3648}
  .pip.f{background:var(--gold)}
  .row{display:flex;gap:6px;flex-wrap:wrap}
  .kv{display:flex;justify-content:space-between;font-size:11.5px;color:var(--dim);padding:1px 0}
  .kv b{color:var(--txt);font-weight:600}
  #log{height:96px;overflow:auto;font-size:11.5px;line-height:1.5;color:var(--dim)}
  #log div{border-bottom:1px solid #1c2430;padding:2px 0}
  #log .hl{color:var(--gold)}
  #log .bad{color:var(--red)}
  #log .good{color:var(--grn)}
  select{width:100%;font:inherit;font-size:12px;color:var(--txt);background:var(--panel2);
    border:1px solid var(--line);border-radius:7px;padding:6px 8px;cursor:pointer}
  /* ---------- overlays ---------- */
  .ovl{position:absolute; inset:0; display:grid; place-items:center; text-align:center;
       background:rgba(5,8,12,.86); border-radius:10px; z-index:5}
  .ovl h1{font-size:44px; margin:0 0 8px; letter-spacing:.06em}
  .ovl p{color:var(--dim); margin:0 0 18px; max-width:520px}
  .hide{display:none!important}
  #toast{position:absolute; top:12px; left:50%; transform:translateX(-50%); z-index:6;
    background:rgba(10,14,20,.92); border:1px solid var(--line); padding:8px 16px; border-radius:20px;
    font-size:13px; pointer-events:none; opacity:0; transition:opacity .25s}
  #toast.show{opacity:1}
  #bSkip{position:absolute; top:12px; right:12px; z-index:7; font-size:12px;
    background:rgba(10,14,20,.9); border-color:#3d5a80}
  #bosshp{position:absolute; top:10px; left:50%; transform:translateX(-50%); width:64%; z-index:4; display:none}
  #bosshp .lbl{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:3px;text-shadow:0 2px 4px #000}
  #bosshp .bar{height:13px;background:#20121a;border:1px solid #5c2833;border-radius:7px;overflow:hidden}
  #bosshp .fil{height:100%;background:linear-gradient(90deg,#ff2d4b,#ff8a3d);width:100%}
  .hint{font-size:11px;color:var(--dim);text-align:center;margin-top:2px}
  kbd{background:#0c1119;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;font-size:11px}
  /* ---------- menu / co-op lobby ---------- */
  #ovlMenu{position:fixed;inset:0;display:grid;place-items:center;text-align:center;
    background:radial-gradient(900px 560px at 50% 34%,#16202e,#05080c 78%);z-index:50;
    overflow:auto;padding:20px 0}
  .mScreen{max-width:560px;padding:0 22px;width:100%}
  .mScreen h1{font-size:52px;margin:0 0 6px;letter-spacing:.06em;
    background:linear-gradient(180deg,#fff,#8fb4d8);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  .mKick{font-size:12px;letter-spacing:.4em;color:var(--acc)}
  .mScreen p{color:var(--dim);margin:0 0 18px;line-height:1.6;font-size:13.5px}
  .mBtns{display:flex;flex-direction:column;gap:10px;max-width:360px;margin:0 auto}
  .mBig{padding:13px 18px;font-size:15px;font-weight:700;text-align:left;display:flex;gap:13px;align-items:center}
  .mBig .mIc{font-size:22px;line-height:1}
  .mBig .mSub{display:block;font-size:11px;font-weight:400;color:var(--dim);letter-spacing:0;margin-top:2px}
  .mBack{margin-top:16px;font-size:12px;background:none;border:none;color:var(--dim)}
  .mBack:hover:not(:disabled){color:var(--txt);background:none;border-color:transparent}
  #mCode{font:700 30px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.34em;text-align:center;
    color:var(--gold);background:#0c1119;border:1px solid var(--line);border-radius:10px;
    padding:15px 6px 15px 20px;width:100%;max-width:360px;text-transform:uppercase;outline:none}
  #mCode:focus{border-color:var(--acc)}
  .codeBox{font:700 34px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.34em;color:var(--gold);
    background:#0c1119;border:1px dashed #5c6a80;border-radius:10px;padding:17px 6px 17px 22px;
    margin:0 auto 12px;max-width:360px;user-select:all}
  .mNote{font-size:11.5px;color:var(--dim);margin-top:14px;line-height:1.65}
  .codeArea{width:100%;height:74px;resize:none;font:600 11px/1.45 ui-monospace,Menlo,Consolas,monospace;
    color:var(--gold);background:#0d1219;border:1px dashed var(--line);border-radius:8px;
    padding:9px 11px;word-break:break-all}
  .codeArea:focus{border-color:var(--acc);outline:none}
  .codeArea.paste{color:var(--txt);border-style:solid}
  .mStep{font-size:11px;letter-spacing:.16em;color:var(--acc);margin:14px 0 6px;text-align:left}
  .mAlt{margin-top:12px;font-size:12px;background:none;border:none;color:var(--gold);text-decoration:underline}
  .mAlt:hover:not(:disabled){background:none;border-color:transparent;color:var(--txt)}
  .mWait{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--gold);
    margin-right:8px;vertical-align:middle;animation:mpulse 1s infinite}
  @keyframes mpulse{0%,100%{opacity:.2}50%{opacity:1}}
  .mErr{color:var(--red);font-size:12.5px;min-height:18px;margin-top:8px;line-height:1.4}
  /* ---------- touch screens / small windows ----------
     The canvas claims its own gestures so Safari stops scrolling and
     zooming the page out from under the battlefield. */
  canvas{touch-action:none; -webkit-user-select:none; user-select:none;
         -webkit-tap-highlight-color:transparent}
  @media (pointer:coarse){
    button{padding:11px 13px}
    .tw{padding:10px 9px}
    .up{padding:9px 8px}
    .mBig{padding:15px 18px}
    #log{height:74px}
  }
  /* tablet landscape: keep the shop beside the field, let the canvas
     fit the height instead of running off the bottom */
  @media (max-width:1400px){
    canvas{max-height:calc(100vh - 128px); max-height:calc(100dvh - 128px);
           width:auto; height:auto}
    /* the shop scrolls inside itself, so the battlefield never leaves the screen */
    #side{max-height:calc(100vh - 20px); max-height:calc(100dvh - 20px);
          overflow-y:auto; -webkit-overflow-scrolling:touch}
  }
  @media (max-width:1180px){
    body{padding:8px}
    #side{width:280px; flex:0 0 280px}
  }
  /* narrow / portrait: stack, and put the cards side by side */
  @media (max-width:880px){
    body{align-items:flex-start}
    #app{flex-direction:column; align-items:stretch}
    #stage{width:100%}
    canvas{width:100%; max-height:none}
    #side{width:100%; flex:1 1 auto; flex-direction:row; flex-wrap:wrap;
          max-height:none; overflow:visible}
    #side .card{flex:1 1 300px; min-width:0}
  }
  @media (max-width:620px){
    #side{flex-direction:column}
    .ovl h1{font-size:30px}
    .mScreen h1{font-size:38px}
  }
</style>
</head>
<body>
<div id="app">
  <div>
    <div id="hud">
      <div class="stat"><b id="hCash">$0</b><span>Funds</span></div>
      <div class="stat"><b id="hInt">100</b><span>Health</span></div>
      <div class="stat"><b id="hWave">0 / 50</b><span>Wave</span></div>
      <div class="stat" id="hMP" style="min-width:auto;display:none"><b id="hMPv" style="font-size:13px">&mdash;</b><span>Co-op</span></div>
      <div class="stat" style="min-width:40px"><b style="font-size:12px;color:var(--dim)">b25</b><span>Build</span></div>
      <div class="grow"></div>
      <button id="bRepair" title="Patch the perimeter">🛠 Repair</button>
      <button id="bStart" class="go">Send Wave 1</button>
      <button id="bPause">⏸</button>
      <button id="bSpeed">1×</button>
      <button id="bSound">🔊</button>
      <button id="bGore" title="Blood and bodies">🩸</button>
      <button id="bCam" title="Auto-camera follows the fight">🎥</button>
    </div>
    <div id="stage">
      <canvas id="cv" width="960" height="576"></canvas>
      <div id="bosshp"><div class="lbl"><span id="bName">BADDY BOSS BEN</span><span id="bPct">100%</span></div><div class="bar"><div class="fil" id="bFill"></div></div></div>
      <div id="toast"></div>
      <button id="bSkip">SKIP INTRO &#9654;</button>
      <div id="ovlCut" class="ovl hide"></div>
      <div id="ovlMenu"></div>
      <div id="ovlEnd" class="ovl hide">
        <div>
          <h1 id="endT">BASE LOST</h1>
          <p id="endP"></p>
          <button id="bAgain" class="go" style="padding:11px 24px;font-size:15px">Redeploy</button>
        </div>
      </div>
    </div>
    <div class="hint" id="hint"><kbd>Space</kbd> wave · <kbd>1-5</kbd> unit · <kbd>Esc</kbd> cancel · <kbd>S</kbd> sell · <kbd>F</kbd> auto-cam · scroll to zoom · right-drag to pan</div>
  </div>

  <div id="side">
    <div class="card">
      <h3>Deployable Units</h3>
      <div class="shop" id="shop"></div>
    </div>
    <div class="card" id="cSel">
      <h3>Selected Unit</h3>
      <div id="selBody"><div style="color:var(--dim);font-size:12px">Click a deployed unit to inspect and upgrade it.</div></div>
    </div>
    <div class="card">
      <h3>Field Report</h3>
      <div id="log"></div>
    </div>
    </div>
  </div>
</div>

if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){
    if(typeof r!=='number') r=(r&&r[0])||0;

    this.arcTo(x+w,y,x+w,y+h,r); this.arcTo(x+w,y+h,x,y+h,r);
    this.arcTo(x,y+h,x,y,r);     this.arcTo(x,y,x+w,y,r);

  };
}
/* ============================================================
   SWAT RAIDERS™  —  defend the Super Duper Secret CIA Base
   ============================================================ */
const CV = document.getElementById('cv'), X = CV.getContext('2d');
const W = 960, H = 576, CS = 48, COLS = 20, ROWS = 12;
const FINAL_WAVE = 50;

/* ---------- the road the gangs walk ---------- */
const PATH_CELLS = [[-1.2,6],[3,6],[3,2],[8,2],[8,9],[13,9],[13,4],[16,4],[16,6.6],[19.9,6.6]];
const PATH = PATH_CELLS.map(([c,r]) => ({x:(c+.5)*CS, y:(r+.5)*CS}));
const SEG = [], BASE_RECT = {x:17.1*CS, y:3.6*CS, w:W-17.1*CS, h:5.4*CS};
let PATH_LEN = 0;
for (let i=0;i<PATH.length-1;i++){
  const a=PATH[i], b=PATH[i+1], dx=b.x-a.x, dy=b.y-a.y, L=Math.hypot(dx,dy);
  SEG.push({a,b,L,ux:dx/L,uy:dy/L,s:PATH_LEN}); PATH_LEN += L;
}
function epos(e){
  const p=posAt(e.d);
  if(!e.off) return p;
  return {x:p.x - Math.sin(p.ang)*e.off, y:p.y + Math.cos(p.ang)*e.off, ang:p.ang};
}
function posAt(d){
  if (d<=0) return {x:PATH[0].x, y:PATH[0].y, ang:0};
  for (const s of SEG) if (d <= s.s+s.L)
    return {x:s.a.x+s.ux*(d-s.s), y:s.a.y+s.uy*(d-s.s), ang:Math.atan2(s.uy,s.ux)};
  const l=SEG[SEG.length-1];
  return {x:l.b.x, y:l.b.y, ang:Math.atan2(l.uy,l.ux)};
}
function distToPath(x,y){
  let best=1e9;
  for (const s of SEG){
    let t=((x-s.a.x)*s.ux+(y-s.a.y)*s.uy); t=Math.max(0,Math.min(s.L,t));
    best=Math.min(best, Math.hypot(x-(s.a.x+s.ux*t), y-(s.a.y+s.uy*t)));
  }
  return best;
}
/* build a map of legal build cells */
const CELLDIST = [];
const BUILDABLE = [];
for (let r=0;r<ROWS;r++){ BUILDABLE[r]=[]; CELLDIST[r]=[];
  for (let c=0;c<COLS;c++){
    const x=(c+.5)*CS, y=(r+.5)*CS;
    CELLDIST[r][c] = distToPath(x,y);
    const onBase = x>BASE_RECT.x-6 && y>BASE_RECT.y-6 && y<BASE_RECT.y+BASE_RECT.h+6;
    BUILDABLE[r][c] = distToPath(x,y) > 36 && !onBase;
  }
}

/* Ben turns up every tenth wave and comes back worse every single time. Every
   appearance raises the whole profile at once \u2014 health, speed, armour, how hard
   he hits the vault, how often his abilities come round, how many men he calls.
   Two of those appearances also hand him something brand new:
     appearance 2 (wave 20) \u2014 SHOCKWAVE: knocks nearby units offline
     appearance 4 (wave 40) \u2014 RALLY pulls in any kind of baddy, not just Gangsters */
const BOSS_RALLY = ['thug','gunman','robber','bully','terror'];
function plural(name,n){                      // Gunmen, Bullies, Gangsters
  if(n===1) return name;
  if(name==='Gunman') return 'Gunmen';
  return name.endsWith('y') ? name.slice(0,-1)+'ies' : name+'s';
}
function bossPower(k){
  return {
    hpMul:   Math.pow(2.2,k-1)*(1+0.18*(k-1)),
    spd:     BOSS.spd + (k-1)*5,
    armor:   (k-1)*2,                       // soaks up chip damage a little more each time
    leak:    BOSS.dmg + 4*k,
    r:       BOSS.r + k*1.5,
    abilCd:  Math.max(4.2, 9.5 - k*1.1),    // abilities come round faster
    rally:   Math.floor(Math.min(9, 2+k*1.5)),
    rallyHp: 1 + (k-1)*0.8,                 // and the men he calls are tougher too
    stun:    k>=2,                          // unlocked after wave 10
    stunT:   2.6 + k*0.7,
    stunR:   150 + k*22,
    anyType: k>=4,                          // unlocked after wave 30
  };
}

/* ---------- RED EYES ----------
   Not a unit of its own: any of the crew can turn up red-eyed. Same weapons, same
   weaknesses, same tower matchups — just wound a notch tighter. A little quicker,
   a little tougher, hits the base a little harder, and pays out more for the trouble.
   Chance climbs slowly with the wave number so late crowds are noticeably meaner. */
const RED_EYE = {from:4, hp:1.45, spd:1.22, gold:1.6, leak:1, chance:.10, gain:.006, cap:.30};
function redEyeChance(){
  return Math.min(RED_EYE.cap, RED_EYE.chance + Math.max(0,G.wave-RED_EYE.from)*RED_EYE.gain);
}

/* ---------- audio ----------
   Browsers refuse to make noise until the page has seen a real user gesture, and
   a context created before that gesture is born 'suspended' and stays that way
   until something resumes it. Everything below exists so the game can never end
   up silently playing into a dead context: the context is unlocked on ANY first
   input, every sound checks the state before it bothers building nodes, and if
   the browser still refuses we say so in the field report instead of leaving the
   player wondering why the game is mute. */
let AC=null, sndOn=true, MASTER=null, audioWarned=false;
function acGet(){
  if(!AC){
    AC = new (window.AudioContext||window.webkitAudioContext)();
    /* one master bus for every sound, so a heavy wave stacking a dozen shots on
       top of a taunt gets caught by a limiter instead of clipping */
    MASTER = AC.createDynamicsCompressor();
    MASTER.threshold.value=-8; MASTER.knee.value=6; MASTER.ratio.value=8;
    MASTER.attack.value=0.003; MASTER.release.value=0.12;
    MASTER.connect(AC.destination);
  }
  return AC;
}
function dest(){ acGet(); return MASTER; }
function audioLive(){                       // true only when sound can actually be heard
  let c; try{ c=acGet(); }catch(e){ return false; }
  if(c.state==='running') return true;
  if(c.state==='suspended'){ try{ const p=c.resume(); if(p&&p.catch) p.catch(()=>{}); }catch(e){} }
  return false;
}
function audioBlocked(){
  if(audioWarned) return; audioWarned=true;
  const b=document.getElementById('bSound');
  if(b){ b.textContent='🔇'; b.title='Click anywhere to enable sound'; }
  if(typeof log==='function') log('Sound is blocked by the browser until you click the page. Click anywhere to switch it on.','bad');
}
/* Unlock on the first input of any kind. Safari in particular wants a buffer
   actually started inside the gesture, not just a resume() call. */
const UNLOCK_EV=['pointerdown','touchend','keydown','click'];
function unlockAudio(){
  let c; try{ c=acGet(); }catch(e){ audioBlocked(); return; }
  if(c.state==='running'){ loadVO(); return; }     // already live — nothing to do
  /* The listeners are deliberately NEVER removed. A context can be suspended
     again long after the first unlock — backgrounding the tab, the OS taking
     audio focus, Chrome idling it — and without a standing handler the game
     would go quiet for the rest of the session with no way back. */
  try{ const b=c.createBuffer(1,1,c.sampleRate), sp=c.createBufferSource();
       sp.buffer=b; sp.connect(c.destination); sp.start(0); }catch(e){}
  const settle=()=>{
    if(c.state!=='running') return;
    const b=document.getElementById('bSound');
    if(b && sndOn){ b.textContent='🔊'; b.title='Sound on'; }
    audioWarned=false;
  };
  try{ const pr=c.resume(); if(pr&&pr.then) pr.then(settle,audioBlocked); }catch(e){ audioBlocked(); }
  settle();
  loadVO();
}
/* a tab coming back to the foreground should get its sound back without a click */
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) unlockAudio(); });
UNLOCK_EV.forEach(ev=>addEventListener(ev,unlockAudio,{passive:true}));
function beep(f,d,type,vol){
  if(!sndOn) return;
  try{
    if(!audioLive()) return;              // don't stack nodes into a dead context
    const c=acGet();
    const o=c.createOscillator(), g=c.createGain();
    o.type=type||'square'; o.frequency.value=f;
    g.gain.setValueAtTime(vol||.035, c.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001, c.currentTime+d);
    o.connect(g); g.connect(dest()); o.start(); o.stop(c.currentTime+d);
  }catch(e){}
}

const VOB={};                       // decoded audio buffers
let voSrc=null, voLoaded=false;
function voCtx(){ return acGet(); }
function b64ToBuf(b64){
  const bin=atob(b64), n=bin.length, bytes=new Uint8Array(n);
  for(let i=0;i<n;i++) bytes[i]=bin.charCodeAt(i);
  return bytes.buffer;
}
function loadVO(){
  if(voLoaded) return; voLoaded=true;
  let c; try{ c=voCtx(); }catch(e){ return; }
  for(const k in VO){
    try{ c.decodeAudioData(b64ToBuf(VO[k]), b=>{ VOB[k]=b; }, ()=>{}); }catch(e){}
  }
}
/* a short synthetic room, so the voice sits in a space instead of in a vacuum */
const IRCACHE={};
function impulse(seconds, decay){
  /* the room never changes per voice, so build each one once instead of
     synthesising ~125k samples on the main thread every single line */
  const ck=seconds+'/'+decay;
  if(IRCACHE[ck]) return IRCACHE[ck];
  const c=voCtx(), len=Math.max(1,(c.sampleRate*seconds)|0), buf=c.createBuffer(2,len,c.sampleRate);
  for(let ch=0;ch<2;ch++){
    const d=buf.getChannelData(ch);
    for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,decay);
  }
  return IRCACHE[ck]=buf;
}
function gritCurve(amount){
  const n=1024, curve=new Float32Array(n);
  for(let i=0;i<n;i++){ const x=i*2/n-1; curve[i]=(1+amount)*x/(1+amount*Math.abs(x)); }
  return curve;
}
/* Pitch and pace are baked into the clips by tools/build_vo.py, at the synth
   level, where the formants move with the pitch. Slowing playback here would
   just be a tape effect — the giveaway that used to make these read as robots —
   so playback runs at 1.0 and this chain only does what a mixing desk does:
   clear the mud, notch the synthetic buzz, add air, then put it in a room. */
const VOMIX = {
  NARRATOR:{hp: 70, lowGain: 4.0, lowF:150, buzzF:3050, buzzCut:-6.5, buzzQ:2.6,
            airGain: 2.5, airF:9500, hiGain:-2.0, hiF:12000, grit:0.0, wet:0.17, room:1.3, decay:2.6},
  BEN:     {hp: 62, lowGain: 5.5, lowF:120, buzzF:2750, buzzCut:-7.5, buzzQ:2.2,
            airGain: 1.5, airF:8200, hiGain:-4.5, hiF:11000, grit:1.5, wet:0.10, room:0.8, decay:2.2},
  DISPATCH:{hp:430, lowGain:-3.0, lowF:300, buzzF:2400, buzzCut:-4.0, buzzQ:1.8,
            airGain: 0.0, airF:9000, hiGain: -3.0, hiF:9000, grit:1.6, wet:0.06, room:0.35, decay:3.0, radio:true},
};
function stopVO(){ if(voSrc){ try{ voSrc.stop(); }catch(e){} voSrc=null; } }
function playVO(key, who){
  if(!sndOn || !key) return false;
  loadVO();
  const buf=VOB[key];
  if(!buf) return false;                            // still decoding — caller retries
  let c; try{ c=voCtx(); }catch(e){ return false; }
  if(!audioLive()) return false;                    // context asleep — caller retries
  stopVO();
  const m = VOMIX[who] || VOMIX.NARRATOR;
  /* barks repeat all game; a fraction of a percent of drift keeps a replay from
     sounding like the exact same take stamped out again */
  const src=c.createBufferSource(); src.buffer=buf;
  src.playbackRate.value = 1 + (Math.random()-0.5)*0.012;
  const bq=(type,f,q,g)=>{ const n=c.createBiquadFilter(); n.type=type; n.frequency.value=f;
                           if(q!=null) n.Q.value=q; if(g!=null) n.gain.value=g; return n; };
  const chain=[
    bq('highpass',  m.hp,     0.7,  null),          // rumble and shift artefacts
    bq('lowshelf',  m.lowF,   null, m.lowGain),     // chest
    bq('peaking',   m.buzzF,  m.buzzQ, m.buzzCut),  // the synthetic buzz band
    bq('peaking',   m.airF,   0.9,  m.airGain),     // air — what a mic hears and a synth misses
    bq('highshelf', m.hiF,    null, m.hiGain),
  ];
  let node = src; chain.forEach(f=>{ node.connect(f); node=f; });
  if(m.radio){                                      // narrow band = sounds like a transmission
    const rhp=bq('highpass',520,0.9,null), rlp=bq('lowpass',2900,0.9,null);
    node.connect(rhp); rhp.connect(rlp); node=rlp;
  }
  if(m.grit>0){
    const ws=c.createWaveShaper(); ws.curve=gritCurve(m.grit); ws.oversample='2x';
    node.connect(ws); node=ws;
  }
  const comp=c.createDynamicsCompressor();
  comp.threshold.value=-22; comp.knee.value=12; comp.ratio.value=4;
  comp.attack.value=0.004; comp.release.value=0.18;
  node.connect(comp);
  const dry=c.createGain(); dry.gain.value=1.0;
  const wet=c.createGain(); wet.gain.value=m.wet;
  const rev=c.createConvolver(); rev.buffer=impulse(m.room,m.decay);
  comp.connect(dry); dry.connect(dest());
  comp.connect(rev); rev.connect(wet); wet.connect(dest());
  src.onended=()=>{ if(voSrc===src) voSrc=null; };
  voSrc=src; src.start();
  return true;
}
function shutUp(){ stopVO(); }

const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;

/* ---------- unit construction / upgrades ---------- */
function pathDistNear(x,y){
  let best=1e9, at=0;
  for(const sg of SEG){
    let u=((x-sg.a.x)*sg.ux+(y-sg.a.y)*sg.uy); u=Math.max(0,Math.min(sg.L,u));
    const d=Math.hypot(x-(sg.a.x+sg.ux*u), y-(sg.a.y+sg.uy*u));
    if(d<best){ best=d; at=sg.s+u; }
  }
  return at;
}
function makeTower(key, cx, cy){
  const t = {id:G.nextId++, owner:0, key, def:TOWERS[key], cx, cy, x:(cx+.5)*CS, y:(cy+.5)*CS,
             up:[0,0], cd:0, ang:-Math.PI/2, spent:TOWERS[key].cost,
             bDmg:0, bRate:0, bDet:false, disabled:0, tmr1:0, tmr2:0, swing:0, target:'first', kills:0};
  t.pathD = pathDistNear(t.x,t.y);
  recalc(t); return t;
}
function recalc(t){
  const d=t.def;
  Object.assign(t,{dmg:d.dmg,rate:d.rate,range:d.range,bspeed:d.bspeed||600,
    splash:d.splash||0, chain:d.chain||0, slow:d.slow||0, slowT:d.slowT||1,
    burn:0, burnT:2, pierce:!!d.pierce, detect:!!d.detect, shots:1, multi:1, punch:0,
    crit:0, critMul:2, bossMul:1, mark:0, stun:0, income:0, bounty:0, weakVs:d.weakVs||null,
    globalDetect:false, buffDetect:!!d.buffDetect, airstrike:0, lockdown:0, pool:false,
    buffDmg:d.buffDmg||0, buffRate:d.buffRate||0, support:!!d.support, hitscan:!!d.hitscan, arc:!!d.arc,
    heroPunch:!!d.heroPunch, punchR:d.punchR||0, punchStun:0,
    spawner:!!d.spawner, manSpeed:d.manSpeed||78, manPierce:d.manPierce||1});
  for(let p=0;p<2;p++) for(let i=0;i<t.up[p];i++) d.paths[p].tiers[i].a(t);
}
function upgradeCost(t,p){ const i=t.up[p]; return i>=3?null:t.def.paths[p].tiers[i].c; }
function canUpgrade(t,p){
  const i=t.up[p]; if(i>=3) return false;
  return !(i>=2 && t.up[1-p]>=3);         // only one path may reach tier 3
}
function towerValue(t){ return Math.floor(t.spent*0.75); }
/* Each additional unit of the same type is dearer than the last, so an army
   has a natural ceiling instead of covering every tile on the map. */
function unitCost(key){
  const owned = G.towers.reduce((n,t)=>n+(t.key===key?1:0),0);
  return Math.round(TOWERS[key].cost * (1 + 0.24*owned));
}

/* ---------- buffs from Comms Officers ---------- */
function applyBuffs(){
  for(const t of G.towers){ t.bDmg=0; t.bRate=0; t.bDet=false; }
  G.globalDetect=false;
  for(const s of G.towers){
    if(s.globalDetect) G.globalDetect=true;
    if(!s.support) continue;
    for(const t of G.towers){
      if(t===s) continue;
      if(Math.hypot(t.x-s.x,t.y-s.y)<=s.range){
        t.bDmg=Math.max(t.bDmg,s.buffDmg); t.bRate=Math.max(t.bRate,s.buffRate);
        if(s.buffDetect) t.bDet=true;
      }
    }
  }
}
const eDmg=t=>t.dmg*(1+t.bDmg);
const eRate=t=>t.rate*(1+t.bRate);

function spawn(type,hpMul,spdMul,d0,gMul){
  gMul = gMul || 1;
  const def = ENEMIES[type];
  const e = {id:G.nextId++, type, def, name:def.name, hp:def.hp*hpMul, max:def.hp*hpMul, base:def.spd*spdMul,
    armor:def.armor, gold:Math.round(def.gold*gMul), leak:def.dmg, r:def.r, col:def.col, stealth:!!def.stealth,
    d:d0||rnd(-30,-4), slow:0, slowU:0, burnDps:0, burnU:0, stunU:0, markU:0, markMul:1,
    alive:true, boss:false, wob:Math.random()*6,
    off: type==='van'? rnd(-5,5) : rnd(-15,15), ph:Math.random()};
  e.base *= rnd(.92,1.08);
  if(type!=='van' && G.wave>=RED_EYE.from && Math.random()<redEyeChance()){
    e.redEyes = true;
    e.name    = 'Red-Eyed '+def.name;
    e.hp = e.max = e.max*RED_EYE.hp;
    e.base   *= RED_EYE.spd;
    e.gold    = Math.round(e.gold*RED_EYE.gold);
    e.leak    = def.dmg + RED_EYE.leak;
  }
  G.enemies.push(e); return e;
}
function bossKit(P){
  const kit=['RALLY'+(P.anyType?' \u2014 any kind of baddy':' \u2014 Gangsters')];
  if(P.stun) kit.push('SHOCKWAVE \u2014 knocks units offline');
  return kit;
}
function spawnBoss(k){
  const P  = bossPower(k);
  const hp = BOSS.hp*P.hpMul*(1+0.15*G.bossEsc);
  const e = {id:G.nextId++, type:'boss', def:BOSS, name:BOSS.name, hp, max:hp, base:P.spd,
    armor:P.armor, gold:BOSS.gold*k, leak:P.leak, r:P.r, col:BOSS.col,
    stealth:false, d:-40, slow:0, slowU:0, burnDps:0, burnU:0, stunU:0, markU:0, markMul:1,
    alive:true, boss:true, k, P, abil:P.abilCd, flee:false, wob:0, off:0, ph:0};
  G.enemies.push(e); G.boss=e;
  SFX.boss(); log(`WAVE ${G.wave}: <b>BADDY BOSS BEN</b> has entered the field (appearance ${k}).`,'bad');
  log(`Threat profile: <b>${Math.round(hp).toLocaleString()}</b> HP${P.armor?` \u00b7 ${P.armor} armour`:''} \u00b7 ${bossKit(P).join(' \u00b7 ')}.`,'bad');
  if(k===2) log(`<b>NEW:</b> Ben has learned to <b>stun your units</b> \u2014 keep a spare line back from the road.`,'bad');
  if(k===4) log(`<b>NEW:</b> Ben's rally now drags in <b>Gunmen, Robbers, Bullies and Terrorists</b>.`,'bad');
  const ti=Math.min(k-1,TAUNTS_IN.length-1); taunt(TAUNTS_IN[ti],'i'+(ti+1));
  return e;
}
function visible(e,t){ return !e.stealth || t.detect || t.bDet || G.globalDetect; }

function hurt(e, amt, o){
  if(!e.alive || e.flee) return 0;      // a retreating boss can't be finished off
  o=o||{};
  let dmg = amt;
  if(!o.pierce) dmg = Math.max(1, dmg - e.armor);
  if(e.boss) dmg *= (o.bossMul||1);
  if(e.markU>G.time) dmg *= e.markMul;
  e.hp -= dmg;
  e.flash = G.time + .09;
  if(e.type!=='van' && Math.random()<.45){
    const p=epos(e);
    bloodBurst(p.x+rnd(-4,4), p.y-rnd(8,26), e.boss?4:2, undefined, e.boss?1.4:1);
    if(Math.random()<.3) splat(p.x+rnd(-6,6), p.y+rnd(-2,6), 2);
  }
  if(e.boss && !e.flee && G.wave<FINAL_WAVE && e.hp <= e.max*0.12){ e.hp=e.max*0.12; bossFlee(e); }
  if(e.hp<=0 && e.alive) kill(e,o.src);
  return dmg;
}
function bountyAt(x,y){
  let b=0; for(const t of G.towers) if(t.bounty && Math.hypot(t.x-x,t.y-y)<=t.range) b=Math.max(b,t.bounty);
  return b;
}
function kill(e,src){
  if(!e.alive) return;
  e.alive=false; G.kills++;
  const p=epos(e);
  if(e.boss){ // final wave only — Ben can actually die
    G.cash += e.gold*3;
    fx({type:'boom',x:p.x,y:p.y,r:150,t:0,max:.9,col:'#ffb03a'});
    log(`<b>BADDY BOSS BEN IS DOWN.</b> The base holds.`,'good');
    G.boss=null; win(); return;
  }
  const gold = Math.round(e.gold*(1+bountyAt(p.x,p.y)));
  G.cash += gold;
  if(MP.on && MP.role==='host' && MP.evQ.length<80)
    MP.evQ.push([Math.round(p.x),Math.round(p.y),ETYPES.indexOf(e.type),e.boss?1:0]);
  if(src) src.kills++;
  fx({type:'txt',x:p.x,y:p.y-30,txt:'+$'+gold,t:0,max:.8,col:'#ffcc4d'});
  if(e.type==='van'){
    fx({type:'boom',x:p.x,y:p.y,r:44,t:0,max:.5,col:'#ffb03a'});
    for(let i=0;i<14;i++) part(p.x,p.y,rnd(-70,70),rnd(-110,-20),rnd(.5,1.2),'#3a3a3a',rnd(2,5),'smoke');
    splat(p.x,p.y,5,undefined,'rgba(30,26,22,');
  } else {
    const look=LOOK[e.type]||LOOK.thug;
    corpse(p.x,p.y+(e.boss?10:6),look,e.boss?1.2:1);
    bloodBurst(p.x,p.y-18,e.boss?26:12,undefined,1.5);
    for(let i=0;i<3;i++) part(p.x,p.y-20,rnd(-30,30),rnd(-40,-10),rnd(.4,.9),'#5a5148',rnd(1.5,3),'smoke');
  }
  if(e.def.spawns) for(let i=0;i<e.def.spawns.length;i++){
    const c=spawn(e.def.spawns[i], e.max/ENEMIES[e.type].hp*0.55, 1, Math.max(0,e.d-i*13));
    c.hp=c.max=Math.max(30,c.max);
  }
}
function bossFlee(e){
  if(e.flee) return;
  e.flee=true; e.stunU=0; e.burnU=0; G.bossEsc++;
  const rw = 420*e.k;
  G.cash += rw;
  const to=Math.min(G.bossEsc-1,TAUNTS_OUT.length-1); taunt(TAUNTS_OUT[to],'o'+(to+1));
  log(`BBB breaks contact and escapes with ${Math.round(e.hp)} HP left. Dropped <b>$${rw}</b> — he returns on wave ${G.wave+10}, stronger.`,'hl');
}
function updateEnemies(dt){
  for(const e of G.enemies){
    if(!e.alive) continue;
    if(e.burnU>G.time && e.burnDps>0) hurt(e, e.burnDps*dt, {pierce:true});
    if(!e.alive) continue;
    if(e.def.heal){ // Enforcer patches up nearby gangsters
      e.htm=(e.htm||0)+dt;
      if(e.htm>1){ e.htm=0; const p=epos(e);
        for(const o of G.enemies){ if(!o.alive||o===e||o.boss) continue;
          const q=epos(o);
          if(Math.hypot(p.x-q.x,p.y-q.y)<80 && o.hp<o.max){ o.hp=Math.min(o.max,o.hp+e.def.heal); }
        }
        fx({type:'ring',x:p.x,y:p.y,r:80,t:0,max:.5,col:'#4ade80'});
      }
    }
    if(e.boss && !e.flee){
      e.abil -= dt;
      if(e.abil<=0){
        const P = e.P || (e.P = bossPower(e.k));
        e.abil = P.abilCd; const p=epos(e);
        e.acount = (e.acount||0)+1;
        /* Until the shockwave is unlocked he has nothing else to reach for,
           so he leans on the rally every time instead of wasting a turn. */
        if(P.stun && e.acount%2===0){
          let hit=0;
          for(const t of G.towers) if(Math.hypot(t.x-p.x,t.y-p.y)<P.stunR){ t.disabled=G.time+P.stunT; hit++; }
          fx({type:'shock',x:p.x,y:p.y,r:P.stunR,t:0,max:.7,col:'#ff3b5c'});
          fx({type:'txt',x:p.x,y:p.y-40,txt:'SHOCKWAVE!',t:0,max:1.3,col:'#ff6a7a'});
          if(hit) log(`BBB's shockwave knocks out ${hit} unit${hit>1?'s':''} for ${P.stunT.toFixed(1)}s!`,'bad');
        }else{
          const n=P.rally, tally={};
          for(let i=0;i<n;i++){
            const type = P.anyType ? BOSS_RALLY[Math.floor(Math.random()*BOSS_RALLY.length)] : 'thug';
            spawn(type, P.rallyHp, 1.1, Math.max(0,e.d-8-i*14));
            tally[type]=(tally[type]||0)+1;
          }
          fx({type:'txt',x:p.x,y:p.y-40,txt:P.anyType?'RALLY THE CITY!':'RALLY!',t:0,max:1.3,col:'#ff6a7a'});
          log(P.anyType
            ? `BBB whistles up <b>${n}</b> of his crew \u2014 ${Object.keys(tally).map(k=>tally[k]+' '+plural(ENEMIES[k].name,tally[k])).join(', ')}!`
            : `BBB rallies <b>${n}</b> reinforcements!`, 'bad');
        }
      }
    }
    if(e.flee){
      e.d -= e.base*2.6*dt;
      if(e.d < -60){ e.alive=false; if(G.boss===e) G.boss=null; }
      continue;
    }
    if(e.stunU>G.time) continue;
    const sl = e.slowU>G.time ? (1-e.slow) : 1;
    e.d += e.base*sl*dt;
    if(e.d >= PATH_LEN){
      e.alive=false; G.leaked++;
      G.integ -= e.leak; SFX.leak();
      fx({type:'boom',x:BASE_RECT.x+20,y:PATH[PATH.length-1].y,r:46,t:0,max:.5,col:'#ff4d5e'});
      splat(BASE_RECT.x+16,PATH[PATH.length-1].y,7);
      log(`${e.name} breached the perimeter — <b>-${e.leak}</b> health.`,'bad');
      if(e.boss){ G.boss=null; log('BBB reached the vault. Catastrophic breach.','bad'); }
      if(G.integ<=0) lose();
    }
  }
  G.enemies = G.enemies.filter(e=>e.alive);
  if(G.boss && !G.boss.alive) G.boss=null;
}

/* ============================================================
   TOWERS: targeting + firing
   ============================================================ */
function pickTargets(t){
  const out=[];
  for(const e of G.enemies){
    if(!e.alive||e.flee) continue;
    if(!visible(e,t)) continue;
    const p=epos(e);
    if(Math.hypot(p.x-t.x,p.y-t.y)<=t.range) out.push({e,p});
  }
  if(!out.length) return out;
  const m=t.target;
  out.sort((A,B)=>{
    if(m==='first') return B.e.d-A.e.d;
    if(m==='last')  return A.e.d-B.e.d;
    if(m==='close') return Math.hypot(A.p.x-t.x,A.p.y-t.y)-Math.hypot(B.p.x-t.x,B.p.y-t.y);
    return B.e.hp-A.e.hp;                     // 'strong'
  });
  if(m!=='strong'){ const b=out.find(o=>o.e.boss); if(b && t.bossMul>1) return [b,...out.filter(o=>o!==b)]; }
  return out;
}
function sendArmy(t){
  if(G.army.length>240) return;
  const n=Math.max(1,t.shots);
  for(let i=0;i<n;i++){
    G.army.push({d:t.pathD, spd:t.manSpeed, dmg:eDmg(t), left:t.manPierce, src:t,
      off:rnd(-13,13), ph:Math.random(), alive:true});
  }
  SFX.shot();
}
function updateArmy(dt){
  for(const a of G.army){
    a.d -= a.spd*dt;
    if(a.d<=0){                                   // made it the whole way — he brings back a dollar
      a.alive=false; G.cash += 1;
      if(Math.random()<0.34){
        const q=posAt(0);
        fx({type:'txt',x:q.x+rnd(-8,8),y:q.y-16,txt:'+$1',t:0,max:.7,col:'#9fe6b0'});
      }
      continue;
    }
    const p=posAt(a.d);
    const ax=p.x - Math.sin(p.ang)*a.off, ay=p.y + Math.cos(p.ang)*a.off;
    a.x=ax; a.y=ay; a.ang=p.ang;
    for(const e of G.enemies){
      if(!e.alive||e.flee) continue;
      if(e.stealth) continue;                     // army men cannot see Terrorists
      const q=epos(e);
      if(a.hit && a.hit.has(e)) continue;
      if(Math.hypot(ax-q.x, ay-q.y) < e.r+8){
        (a.hit || (a.hit=new Set())).add(e);
        hurt(e, a.dmg, {src:a.src});
        fx({type:'puff',x:ax,y:ay,r:8,t:0,max:.25,col:'#cdd8a8'});
        if(--a.left<=0){ a.alive=false; }
        break;
      }
    }
  }
  G.army=G.army.filter(a=>a.alive);
}
/* The Super Hero never deals a point of damage. The punch is pure control:
   it staggers whatever it lands on, and the aura does the actual killing
   through whoever happens to be standing in it. */
function stagger(t,e,p){
  e.slow  = Math.max(e.slow, t.slow);
  e.slowU = Math.max(e.slowU, G.time+t.slowT);
  if(t.punchStun) e.stunU = Math.max(e.stunU, G.time+t.punchStun);
  e.flash = G.time+.09;
  fx({type:'puff',x:p.x,y:p.y-18,r:4.5,t:0,max:.2,col:'#bcd8ff'});
}
function heroPunch(t,dt){
  if(t.flash>0) t.flash=Math.max(0,t.flash-dt*9);
  t.cd -= dt*eRate(t);
  const tg=pickTargets(t);
  if(tg.length) t.ang=Math.atan2(tg[0].p.y-t.y, tg[0].p.x-t.x);
  if(t.cd>0 || !tg.length) return;
  t.cd=1; t.flash=1; t.swing=G.time+.24;
  const n=Math.min(Math.max(1,t.multi), tg.length);
  for(let i=0;i<n;i++){
    const {e,p}=tg[i];
    stagger(t,e,p);
    fx({type:'shock',x:p.x,y:p.y+4,r:Math.max(26,t.punchR),t:0,max:.34,col:'#9ec8ff'});
    if(!i) fx({type:'txt',x:p.x,y:p.y-32,txt:'STAGGERED',t:0,max:.55,col:'#9ec8ff'});
    if(t.punchR) for(const o of G.enemies){
      if(!o.alive||o.flee||o===e||!visible(o,t)) continue;
      const q=epos(o);
      if(Math.hypot(q.x-p.x,q.y-p.y)<=t.punchR+o.r) stagger(t,o,q);
    }
  }
  SFX.punch();
}
function updateTowers(dt){
  applyBuffs();
  for(const t of G.towers){
    if(t.support){
      if(t.heroPunch && t.disabled<=G.time) heroPunch(t,dt);
      continue;
    }
    if(t.spawner){
      if(t.disabled>G.time || !G.running) continue;   // no wave, no marching orders
      t.cd -= dt*eRate(t);
      if(t.cd<=0){ t.cd=1; t.ang=Math.PI; sendArmy(t); }
      continue;
    }
    if(t.disabled>G.time){ continue; }
    // special timed abilities
    if(t.airstrike){ t.tmr1-=dt; if(t.tmr1<=0 && G.enemies.length){ t.tmr1=t.airstrike; airstrike(t); } }
    if(t.lockdown){ t.tmr2-=dt; if(t.tmr2<=0){ t.tmr2=t.lockdown; const hits=pickTargets(t);
      if(hits.length){ for(const h of hits) h.e.stunU=Math.max(h.e.stunU,G.time+1.6);
        fx({type:'ring',x:t.x,y:t.y,r:t.range,t:0,max:.6,col:'#b17dff'}); } } }
    if(t.flash>0) t.flash=Math.max(0,t.flash-dt*9);
    t.cd -= dt*eRate(t);
    const tg=pickTargets(t);
    if(tg.length){ t.ang = Math.atan2(tg[0].p.y-t.y, tg[0].p.x-t.x); }
    if(t.cd>0 || !tg.length) continue;
    t.cd = 1;
    fire(t, tg);
  }
}
function fire(t,tg){
  const n=Math.min(t.multi, tg.length);
  for(let i=0;i<n;i++){
    const {e,p}=tg[i];
    for(let s=0;s<t.shots;s++){
      if(t.hitscan) chainZap(t,e,p);
      else G.bullets.push({x:t.x+Math.cos(t.ang)*16, y:t.y+Math.sin(t.ang)*16,
        tgt:e, tx:p.x, ty:p.y, sp:t.bspeed, src:t, hits:new Set(), left:1+t.punch,
        arc:t.arc, life:2.4, spread:s?rnd(-.09,.09):0});
    }
  }
  t.flash = 1;
  const mx=t.x+Math.cos(t.ang)*20, my=t.y-22+Math.sin(t.ang)*20;
  for(let i=0;i<2;i++) part(mx,my,Math.cos(t.ang)*rnd(20,60)+rnd(-20,20),Math.sin(t.ang)*20-rnd(10,40),rnd(.25,.5),'#6a6255',rnd(1,2),'smoke');
  part(t.x-Math.cos(t.ang)*4,t.y-22,-Math.cos(t.ang)*rnd(30,60),-rnd(30,60),rnd(.5,.9),'#d9b45a',1.1,'brass');
  SFX[t.hitscan?'zap':(t.splash?'boom':'shot')]();
}
function bulletDamage(t,e,px,py,mul){
  let dmg=eDmg(t)*(mul||1);
  if(t.weakVs && t.weakVs[e.type]) dmg *= t.weakVs[e.type];
  if(t.crit && Math.random()<t.crit) { dmg*=t.critMul; fx({type:'txt',x:px,y:py-14,txt:'HEADSHOT',t:0,max:.7,col:'#ff4d5e'}); }
  hurt(e,dmg,{pierce:t.pierce,bossMul:t.bossMul,src:t});
  if(t.slow){ e.slow=Math.max(e.slow,t.slow); e.slowU=Math.max(e.slowU,G.time+t.slowT); }
  if(t.burn){ e.burnDps=Math.max(e.burnDps,t.burn); e.burnU=Math.max(e.burnU,G.time+t.burnT); }
  if(t.stun){ e.stunU=Math.max(e.stunU,G.time+t.stun); }
  if(t.mark){ e.markMul=Math.max(e.markMul,t.mark); e.markU=G.time+3; }
}
function explode(t,x,y,radius,mult){
  fx({type:'boom',x,y,r:radius,t:0,max:.42,col:t.pool?'#ff7a2f':'#ffb03a'});
  for(const e of G.enemies){
    if(!e.alive||e.flee) continue;
    const p=epos(e);
    if(Math.hypot(p.x-x,p.y-y)<=radius+e.r) bulletDamage(t,e,p.x,p.y,mult||1);
  }
  if(t.pool) G.fx.push({type:'pool',x,y,r:radius*.8,t:0,max:4,col:'#ff7a2f',dps:t.burn,src:t});
}
function airstrike(t){
  let best=null,bn=-1;
  for(const e of G.enemies){ if(!e.alive||e.flee) continue; const p=epos(e);
    let n=0; for(const o of G.enemies){ if(!o.alive) continue; const q=epos(o); if(Math.hypot(p.x-q.x,p.y-q.y)<110) n++; }
    if(n>bn){bn=n;best=p;} }
  if(!best) return;
  G.fx.push({type:'strike',x:best.x,y:best.y,t:0,max:1.1,src:t});
}
function chainZap(t,first,fp){
  const chain=[{x:t.x,y:t.y}];
  const hit=new Set(); let cur=first, cp=fp, n=Math.max(1,t.chain);
  for(let i=0;i<n;i++){
    if(!cur) break;
    chain.push({x:cp.x,y:cp.y}); hit.add(cur);
    bulletDamage(t,cur,cp.x,cp.y);
    let nx=null,nd=1e9,np=null;
    for(const e of G.enemies){ if(!e.alive||e.flee||hit.has(e)||!visible(e,t)) continue;
      const p=epos(e); const d=Math.hypot(p.x-cp.x,p.y-cp.y);
      if(d<115 && d<nd){nd=d;nx=e;np=p;} }
    cur=nx; cp=np;
  }
  G.fx.push({type:'beam',pts:chain,t:0,max:.16,col:'#c9a6ff'});
}
function updateBullets(dt){
  for(const b of G.bullets){
    if(b.tgt && b.tgt.alive && !b.tgt.flee){ const p=epos(b.tgt); b.tx=p.x; b.ty=p.y; }
    const dx=b.tx-b.x, dy=b.ty-b.y, L=Math.hypot(dx,dy)||1;
    const step=b.sp*dt;
    b.life-=dt;
    if(L<=step+4 || b.life<=0){
      const t=b.src;
      if(t.splash) explode(t,b.tx,b.ty,t.splash);
      else if(b.tgt && b.tgt.alive) bulletDamage(t,b.tgt,b.tx,b.ty);
      b.dead=true; continue;
    }
    b.x+=dx/L*step; b.y+=dy/L*step;
    if(b.left>1){ // punch-through rounds keep going
      for(const e of G.enemies){ if(!e.alive||b.hits.has(e)||e.flee) continue;
        const p=epos(e);
        if(Math.hypot(p.x-b.x,p.y-b.y)<e.r+5){ b.hits.add(e); bulletDamage(b.src,e,p.x,p.y);
          if(--b.left<=1) break; } }
    }
  }
  G.bullets=G.bullets.filter(b=>!b.dead);
}
function fx(o){
  G.fx.push(o);
  /* co-op: the guest never simulates, so every visual effect is shipped to it */
  if(MP.on && MP.role==='host' && MP.fxQ.length<160){
    const c={}; for(const k in o) if(k!=='src') c[k]=o[k];
    MP.fxQ.push(c);
  }
}
function updateFx(dt){
  for(const f of G.fx){
    f.t+=dt;
    if(f.type==='pool' && MP.role!=='client'){
      f.acc=(f.acc||0)+dt;
      if(f.acc>.25){ f.acc=0;
        for(const e of G.enemies){ if(!e.alive) continue; const p=epos(e);
          if(Math.hypot(p.x-f.x,p.y-f.y)<f.r) hurt(e,f.dps*.25,{pierce:true,src:f.src}); } }
    }
    if(f.type==='strike' && !f.done && f.t>.65){
      f.done=true; SFX.boom();
      if(MP.role!=='client') explode(f.src,f.x,f.y,132,3.5);
    }
  }
  G.fx=G.fx.filter(f=>f.t<f.max);
}

/* ============================================================
   WAVES
   ============================================================ */
/* ---------- crowd dial ----------
   One knob for how packed every wave is, on every map and in both modes.
   `count` multiplies the number of bodies of EVERY type (and every per-type
   cap, since those are scaled by the same figure); `pack` tightens the spacing
   so a fuller wave hits harder instead of just running proportionally longer. */
const DENSITY = {count:1.75, pack:1.45};
function buildWave(n){
  const q=[]; let t=1.0;
  const boss = n%10===0;
  // every gangster is the same: 5 health, so a single pistol round drops one.
  // later waves send more of them, and send them a little faster.
  /* Two officers means two firing lines, so co-op sends a much heavier crew:
     roughly 1.8x the bodies, arriving noticeably closer together. */
  const M   = (MP.on ? 1.8 : 1) * DENSITY.count;
  const CAP = Math.round((MP.on ? 150 : 80) * DENSITY.count);
  const count = Math.min(CAP, Math.round((3+n*2.0)*M));
  const guns  = n>=3 ? Math.min(Math.round(30*M), Math.round((n-2)*1.3*M)) : 0;
  const gap   = Math.max((MP.on?.19:.30)/DENSITY.pack,
                        (0.95 - n*.015)/((MP.on?1.55:1)*DENSITY.pack));
  const spdMul= 1+Math.min(.6,(n-1)*.025);
  /* Health holds at the numbers you set for the first 10 waves, then climbs hard,
     so the late game stops being a formality. */
  const hpMul = Math.pow(1.115, Math.max(0, n-5));
  for(let i=0;i<count;i++){ q.push({at:t, type:'thug', hpMul, spdMul}); t+=gap; }
  let gt=2.2;                                   // gunmen walk in among the crowd
  for(let i=0;i<guns;i++){ q.push({at:gt, type:'gunman', hpMul, spdMul}); gt+=gap*1.7; }
  const robbers = n>=5 ? Math.min(Math.round(24*M), Math.max(1, Math.round((n-4)*1.1*M))) : 0;
  let rt=3.4;                                   // robbers sprint through in ones and twos
  for(let i=0;i<robbers;i++){ q.push({at:rt, type:'robber', hpMul, spdMul}); rt+=gap*2.2; }
  const bullies = n>=15 ? Math.min(Math.round(12*M), Math.max(1, Math.round((n-14)*0.6*M))) : 0;
  let bt=5.0;                                   // bullies lumber in behind the crowd
  for(let i=0;i<bullies;i++){ q.push({at:bt, type:'bully', hpMul, spdMul}); bt+=gap*3.2; }
  const terrors = n>=8 ? Math.min(Math.round(16*M), Math.max(1, Math.round((n-7)*0.8*M))) : 0;
  let tt=6.0;                                   // terrorists slip through unseen
  for(let i=0;i<terrors;i++){ q.push({at:tt, type:'terror', hpMul, spdMul}); tt+=gap*2.4; }

  /* the five newcomers — small groups, so they add variety rather than volume.
     M keeps them in step with the co-op wave multiplier. */
  const extras = [
    ['lookout', 2,  0.55, 14, 1.4],
    ['biker',   6,  0.45, 12, 2.0],
    ['van',     9,  0.30,  7, 3.4],
    ['brute',  11,  0.40, 10, 2.6],
    ['fixer',  13,  0.25,  5, 4.0],
  ];
  let slot=2.6;
  for(const [type, from, rate, cap, space] of extras){
    if(n < from) continue;
    const many = Math.min(Math.round(cap*M), Math.max(1, Math.round((n-from+1)*rate*M)));
    let at = slot;
    for(let i=0;i<many;i++){ q.push({at, type, hpMul, spdMul}); at += gap*space; }
    slot += 0.9;
  }
  // Ben walks in last, once his crew has been dealt with
  if(boss) q.push({at:t+3.5, boss:true, k:n/10});
  q.sort((a,b)=>a.at-b.at);
  return q;
}
function startWave(){
  if(MP.role==='client'){
    if(G.mode!=='play') enterGame();
    if(G.over) return;
    if(G.running){ SFX.nope(); toast('Wave '+G.wave+' is still in progress'); return; }
    NET.send({k:'wave'}); return;
  }
  if(G.mode!=='play' && !MP.actor) enterGame();  // clicked during the intro — jump straight in
  if(G.over) return;
  if(G.running){                       // one wave at a time
    SFX.nope(); toast('Wave '+G.wave+' is still in progress');
    return;
  }
  G.wave++;
  const boss=G.wave%10===0;
  G.queue=buildWave(G.wave); G.qt=0; G.running=true;
  log(`— Wave <b>${G.wave}</b> incoming${boss?' :: <b>BOSS</b>':''} —`, boss?'bad':'hl');
  if(G.wave===RED_EYE.from) log(`Intel: some of the crew are showing up <b>red-eyed</b> — faster, tougher, worth more cash. Any of them can be one.`,'bad');
  SFX.buy(); syncHUD();
}
function updateWave(dt){
  if(!G.running) return;
  G.qt += dt;
  while(G.queue.length && G.queue[0].at<=G.qt){
    const s=G.queue.shift();
    if(s.boss) spawnBoss(s.k); else spawn(s.type,s.hpMul,s.spdMul);
  }
  if(!G.queue.length && !G.enemies.length){
    G.running=false;
    let inc = 45 + G.wave*5;
    for(const t of G.towers) inc += t.income;
    G.cash += inc;
    log(`Wave ${G.wave} cleared. Payroll + assets: <b>$${inc}</b>.`,'good');
    if(G.wave>=FINAL_WAVE && !G.over) win();
    syncHUD();
  }
}

/* ============================================================
   PLACEMENT / SELECTION
   ============================================================ */
function cellAt(x,y){ return {c:Math.floor(x/CS), r:Math.floor(y/CS)}; }
function occupied(c,r){ return G.towers.some(t=>t.cx===c&&t.cy===r); }
function canPlace(c,r){
  return c>=0&&r>=0&&c<COLS&&r<ROWS&&BUILDABLE[r][c]&&!occupied(c,r);
}
function tryPlace(c,r,keyIn){
  const key=keyIn||G.place; if(!key) return;
  if(MP.role==='client'){ NET.send({k:'place',key,c,r}); return; }
  const mine = !MP.actor;                       // false when the partner asked for this
  const cost=unitCost(key);
  if(!canPlace(c,r)){ SFX.nope(); toast('Cannot deploy there'); return; }
  if(G.cash<cost){ SFX.nope(); toast('Not enough funds'); return; }
  G.cash-=cost; const t=makeTower(key,c,r); t.spent=cost; t.owner=MP.actor?1:MP.me;
  G.towers.push(t);
  SFX.place();
  log(`${MP.on?'P'+(t.owner+1)+' ':''}${TOWERS[key].name} deployed. <b>-$${cost}</b>`);
  if(CELLDIST[r][c] >= t.range){
    toast('That spot is out of reach of the road — move him closer');
    log(`${TOWERS[key].name} is too far from the road to hit anything.`,'bad');
  }
  if(mine){ G.sel=t; if(G.cash < unitCost(key)) G.place=null; }
  else NET.send({k:'sel',id:t.id});
  syncHUD(); renderSel(); renderShop();
}
function sellSel(tIn){
  const t = (tIn && tIn.def) ? tIn : G.sel;     // the Sell button hands us a click event
  if(!t) return;
  if(MP.role==='client'){ NET.send({k:'sell',id:t.id}); return; }
  const v=towerValue(t);
  G.cash+=v; G.towers=G.towers.filter(x=>x!==t);
  log(`${t.def.name} pulled off the line. <b>+$${v}</b>`);
  if(G.sel===t) G.sel=null;
  SFX.buy(); syncHUD(); renderSel(); renderShop();
}
function buyUp(p,tIn){
  const t=tIn||G.sel; if(!t||!canUpgrade(t,p)) { SFX.nope(); return; }
  if(MP.role==='client'){ NET.send({k:'up',id:t.id,p}); return; }
  const c=upgradeCost(t,p);
  if(G.cash<c){ SFX.nope(); toast('Not enough funds'); return; }
  const tier=t.def.paths[p].tiers[t.up[p]];
  G.cash-=c; t.spent+=c; t.up[p]++; recalc(t); SFX.buy();
  log(`${t.def.name} → <b>${tier.n}</b> (-$${c})`);
  syncHUD(); renderSel(); renderShop();
}

/* ============================================================
   RENDER  —  close 3rd-person view, human figures, gore
   ============================================================ */
const CAM = {x:480,y:288,z:2.3,userZ:2.3,follow:true,drag:null,moved:0};
function camLimits(z){ return {hw:Math.min(W/(2*z),W/2), hh:Math.min(H/(2*z),H/2)}; }
function camClamp(){
  const {hw,hh}=camLimits(CAM.z);
  CAM.x=clamp(CAM.x,hw,W-hw); CAM.y=clamp(CAM.y,hh,H-hh);
}
function s2w(sx,sy){ return {x:(sx-W/2)/CAM.z+CAM.x, y:(sy-H/2)/CAM.z+CAM.y}; }
function updateCam(dt){
  const tz = G.place ? 1.0 : CAM.userZ;
  CAM.z += (tz-CAM.z)*Math.min(1,dt*6);
  if(CAM.follow && !G.place && !CAM.drag){
    let tx=0,ty=0,wt=0;
    for(const e of G.enemies){ if(!e.alive) continue; const p=epos(e);
      const w = e.boss?14:(1+e.d/PATH_LEN*2); tx+=p.x*w; ty+=p.y*w; wt+=w; }
    if(wt){ tx/=wt; ty/=wt;
      CAM.x += (tx-CAM.x)*Math.min(1,dt*1.6); CAM.y += (ty-CAM.y)*Math.min(1,dt*1.6); }
  }
  camClamp();
}
/* ---------- colour helpers ---------- */
function shade(hex,a){
  const n=parseInt(hex.slice(1),16); let r=n>>16&255,g=n>>8&255,b=n&255;
  if(a<0){ const f=1+a; r*=f; g*=f; b*=f; } else { r+=(255-r)*a; g+=(255-g)*a; b+=(255-b)*a; }
  return 'rgb('+(r|0)+','+(g|0)+','+(b|0)+')';
}

/* ============================================================

   feet sit on (x,y); the figure stands upright and aims a weapon
   ============================================================ */
function gunSprite(c,type,flash){
  if(!type) return;
  c.save();
  if(type==='pistol'){
    c.fillStyle='#1b1e24'; c.fillRect(0,-1.6,9,3.2); c.fillRect(1.5,0,3,4.5);
    c.fillStyle='#33383f'; c.fillRect(6,-1.2,3,1.2);
  } else if(type==='rifle'){
    c.fillStyle='#20242b'; c.fillRect(-4,-1.8,22,3.6);
    c.fillStyle='#12151a'; c.fillRect(2,1.4,3.4,5); c.fillRect(-4,-2.6,7,1.4);
    c.fillStyle='#3a4149'; c.fillRect(15,-1.1,4,2.2);
  } else if(type==='smg'){
    c.fillStyle='#1d2128'; c.fillRect(-2,-1.7,14,3.4); c.fillRect(2,1.2,3,5.5);
  } else if(type==='sniper'){
    c.fillStyle='#2c3327'; c.fillRect(-6,-1.9,30,3.8);
    c.fillStyle='#14181a'; c.fillRect(6,-4.6,9,2.4); c.fillRect(4,1.6,3,5);
    c.fillStyle='#4a5340'; c.fillRect(22,-1.2,4,2.4);
  } else if(type==='launcher'){
    c.fillStyle='#3b3a2a'; c.fillRect(-4,-3.2,20,6.4);
    c.fillStyle='#1a1a14'; c.fillRect(14,-3.6,4,7.2); c.fillRect(1,2.4,3.4,5);
  } else if(type==='pipe'){
    c.fillStyle='#6f757c'; c.beginPath(); c.roundRect(-2,-2.6,30,5.2,2.2); c.fill();
    c.fillStyle='#8f969e'; c.fillRect(0,-2.2,28,1.6);
    c.fillStyle='#4c5257'; c.beginPath(); c.roundRect(24,-4,6,8,2); c.fill();
    c.fillStyle='#2f2a26'; c.fillRect(-2,-2.8,7,5.6);
  } else if(type==='bag'){
    c.fillStyle='#7d7250';
    c.beginPath(); c.ellipse(12,3,7.5,8.5,0,0,7); c.fill();
    c.fillStyle='rgba(255,255,255,.16)'; c.beginPath(); c.ellipse(9.5,0.5,3,3.6,0,0,7); c.fill();
    c.fillStyle='#5d5540'; c.beginPath(); c.roundRect(8,-6.5,9,4.5,2); c.fill();
    c.strokeStyle='#c8b45a'; c.lineWidth=1.4;
    c.beginPath(); c.moveTo(10,-6.5); c.lineTo(15,-6.5); c.stroke();
  } else if(type==='bat'){
    c.fillStyle='#5e422a'; c.fillRect(-1,-2,11,4);                     // grip
    c.beginPath(); c.moveTo(10,-2.6); c.lineTo(25,-4.8); c.lineTo(28.5,-3.6);
    c.lineTo(28.5,3.6); c.lineTo(25,4.8); c.lineTo(10,2.6); c.closePath();
    c.fillStyle='#b5843f'; c.fill();
    c.fillStyle='rgba(255,255,255,.20)'; c.fillRect(12,-3.4,13,1.5);
    c.fillStyle='rgba(0,0,0,.22)'; c.fillRect(12,2,13,1.5);
  } else if(type==='taser'){
    c.fillStyle='#2a2438'; c.fillRect(0,-2,10,4); c.fillRect(2,1.4,3,4.4);
    c.fillStyle='#b17dff'; c.fillRect(9,-1.4,3,2.8);
  }
  const MUZZLE={pistol:10,rifle:20,smg:13,sniper:27,launcher:19,taser:12};
  const mz=MUZZLE[type];
  if(flash>0 && mz){
    const s=flash;
    c.globalAlpha=s;
    c.fillStyle='#fff3b0'; c.beginPath(); c.arc(mz+1,0,4.6*s,0,7); c.fill();
    c.fillStyle='rgba(255,190,70,.85)';
    c.beginPath(); c.moveTo(mz-1,0); c.lineTo(mz+26*s,-4*s); c.lineTo(mz+26*s,4*s); c.closePath(); c.fill();
    c.globalAlpha=1;
  }
  c.restore();
}
function person(c,x,y,o){
  const s=o.s||1, ph=o.ph||0, moving=o.moving, aim=o.aim||0;
  const dead=o.dead;
  c.save(); c.translate(x,y); c.scale(s,s);
  if(dead){ c.rotate(o.rot||1.4); c.translate(0,-3); }
  if(!dead){ c.fillStyle='rgba(0,0,0,.4)'; c.beginPath(); c.ellipse(0,1.5,9.5,4,0,0,7); c.fill(); }
  if(o.cape && !dead){                                 // drawn first so it hangs behind the body
    const flap=Math.sin((ph||0)*6.283)*(moving?2.4:1.2);
    const cg=c.createLinearGradient(0,-28,0,-2);
    cg.addColorStop(0,o.cape); cg.addColorStop(1,shade(o.cape,-.5));
    c.fillStyle=cg;
    c.beginPath(); c.moveTo(-6,-27.5); c.lineTo(6,-27.5);
    c.quadraticCurveTo(10.5+flap,-14, 7.5+flap*1.7,-1.5);
    c.quadraticCurveTo(0,-5.5, -7.5+flap*1.7,-1.5);
    c.quadraticCurveTo(-10.5+flap,-14, -6,-27.5);
    c.fill();
  }
  const sw = moving?Math.sin(ph*6.283)*4.4:0;
  const bob = moving?Math.abs(Math.cos(ph*6.283))*1.1:0;
  c.translate(0,-bob);
  const cl=o.cloth||'#4a5a33', pants=o.pants||shade(cl,-.45);
  /* legs */
  c.lineCap='round'; c.strokeStyle=pants; c.lineWidth=4.6;
  c.beginPath(); c.moveTo(-2.6,-13); c.lineTo(-2.6+sw,-1.5); c.stroke();
  c.beginPath(); c.moveTo(2.6,-13); c.lineTo(2.6-sw,-1.5); c.stroke();
  c.strokeStyle='#15171b'; c.lineWidth=5;
  c.beginPath(); c.moveTo(-2.6+sw,-2.4); c.lineTo(-2.6+sw*1.1,-0.4); c.stroke();
  c.beginPath(); c.moveTo(2.6-sw,-2.4); c.lineTo(2.6-sw*1.1,-0.4); c.stroke();
  /* torso */
  const g=c.createLinearGradient(-7,0,7,0);
  g.addColorStop(0,shade(cl,.16)); g.addColorStop(.5,cl); g.addColorStop(1,shade(cl,-.42));
  c.fillStyle=g; c.beginPath(); c.roundRect(-6.8,-27,13.6,15,4.5); c.fill();
  if(o.vest){
    c.fillStyle=o.vest; c.beginPath(); c.roundRect(-6.2,-26,12.4,11,3.4); c.fill();
    c.fillStyle='rgba(0,0,0,.4)'; c.fillRect(-6.2,-19.6,12.4,1.5);
    c.fillStyle='rgba(255,255,255,.10)'; c.fillRect(-6.2,-25.4,12.4,1.2);
    if(o.pouch){ c.fillStyle=shade(o.vest,-.3);
      c.fillRect(-5.2,-21.4,3.4,3.2); c.fillRect(-.6,-21.4,3.4,3.2); c.fillRect(4,-21.4,1.8,3.2); }
  }
  if(o.belt){ c.fillStyle=o.beltCol||'#16181d'; c.fillRect(-6.6,-14.4,13.2,2.4); }
  if(o.emblem){                                      // chest star
    c.fillStyle=o.emblem;
    c.beginPath();
    for(let i=0;i<10;i++){ const a=-Math.PI/2+i*Math.PI/5, rr=i%2?1.6:3.7;
      const px=Math.cos(a)*rr, py=-21.5+Math.sin(a)*rr;
      i?c.lineTo(px,py):c.moveTo(px,py); }
    c.closePath(); c.fill();
  }
  /* far arm */
  c.strokeStyle=shade(cl,-.3); c.lineWidth=4.2;
  c.beginPath(); c.moveTo(-5.6,-24.5); c.lineTo(-8.5+(moving?sw*.5:0),-16); c.stroke();
  /* head */
  const hx = clamp(Math.cos(aim)*2.2,-2.2,2.2);
  c.fillStyle=o.skin||'#c8996b';
  c.beginPath(); c.ellipse(hx,-31.4,5.3,5.9,0,0,7); c.fill();
  c.fillStyle='rgba(0,0,0,.22)'; c.beginPath(); c.ellipse(hx+2.4,-31.4,2.6,5.6,0,0,7); c.fill();
  c.fillStyle='rgba(0,0,0,.3)'; c.beginPath(); c.ellipse(hx,-26.6,4.6,1.8,0,0,7); c.fill();
  if(o.hood){
    c.fillStyle=shade(cl,-.18); c.beginPath(); c.arc(hx,-31.8,7,Math.PI*.92,Math.PI*2.08); c.fill();
    c.fillStyle='rgba(0,0,0,.62)'; c.beginPath(); c.ellipse(hx,-31.2,4.3,4.6,0,0,7); c.fill();
  } else if(o.helmet){
    c.fillStyle=o.helmet; c.beginPath(); c.arc(hx,-32.4,6,Math.PI,0); c.fill();
    c.fillRect(hx-6,-32.6,12,3.2);
    c.fillStyle='rgba(255,255,255,.16)'; c.beginPath(); c.arc(hx-1.6,-33.6,3.4,Math.PI*1.1,Math.PI*1.75); c.fill();
    if(o.visor){ c.fillStyle='rgba(30,40,55,.85)'; c.beginPath(); c.roundRect(hx-5.2,-31.4,10.4,4.2,1.6); c.fill();
      c.fillStyle='rgba(150,200,255,.28)'; c.fillRect(hx-4.6,-31,4,1.4); }
  } else if(o.cap){
    c.fillStyle=o.cap; c.beginPath(); c.arc(hx,-33,5.6,Math.PI,0); c.fill();
    c.fillRect(hx-5.6,-33.4,11.2,2.4);
    c.fillStyle=shade(o.cap,-.3); c.fillRect(hx+ (Math.cos(aim)>=0?2:-8),-33.6,6,1.8);
  } else if(o.hair){
    c.fillStyle=o.hair; c.beginPath(); c.arc(hx,-32.6,5.5,Math.PI*.98,Math.PI*2.02); c.fill();
  }
  if(o.mask){                                        // domino mask across the eyes
    c.fillStyle=o.mask;
    c.beginPath(); c.roundRect(hx-5.5,-33.4,11,4.8,1.9); c.fill();
    c.fillStyle=shade(o.mask,.28); c.fillRect(hx-5.5,-33.4,11,1);
  }
  if(o.eyes!==false){
    if(o.eyeGlow){                                   // red-eyed: a hot little bloom behind the sockets
      c.save(); c.globalAlpha=.8; c.shadowColor=o.eyeGlow; c.shadowBlur=7; c.fillStyle=o.eyeGlow;
      c.beginPath(); c.ellipse(hx-1.9,-31.6,1.7,1.9,0,0,7); c.ellipse(hx+1.9,-31.6,1.7,1.9,0,0,7); c.fill();
      c.restore();
    }
    c.fillStyle=o.eyeCol||'rgba(20,20,25,.8)';
    c.beginPath(); c.ellipse(hx-1.9,-31.6,.9,1.1,0,0,7); c.ellipse(hx+1.9,-31.6,.9,1.1,0,0,7); c.fill();
  }
  /* weapon + firing arm */
  if(o.punchArm!==undefined){                        // caped fist instead of a muzzle
    const k=o.punchArm, ext=6.5+k*12;
    c.save(); c.translate(0,-22.5); c.rotate(aim);
    c.strokeStyle=o.skin||'#c8996b'; c.lineWidth=3.8; c.lineCap='round';
    c.beginPath(); c.moveTo(0,.8); c.lineTo(ext,0); c.stroke();
    c.fillStyle=o.glove||o.cloth||'#1f4fa8';
    c.beginPath(); c.arc(ext+1.4,0,3.2,0,7); c.fill();
    if(k>.35){ c.strokeStyle='rgba(200,228,255,'+((k-.35)*1.1).toFixed(2)+')'; c.lineWidth=1.4;
      c.beginPath(); c.arc(ext+1.4,0,5.6+k*3,-1.1,1.1); c.stroke(); }
    c.restore();
  } else if(o.gun){
    c.save(); c.translate(0,-22.5); c.rotate(aim);
    c.strokeStyle=o.skin||'#c8996b'; c.lineWidth=3.4; c.lineCap='round';
    c.beginPath(); c.moveTo(0,1.5); c.lineTo(8,0); c.stroke();
    gunSprite(c,o.gun,o.flash||0);
    c.restore();
  } else {
    c.strokeStyle=shade(cl,-.12); c.lineWidth=4.2;
    c.beginPath(); c.moveTo(5.6,-24.5); c.lineTo(8.6-(moving?sw*.5:0),-16); c.stroke();
  }
  if(o.shield){
    c.save(); c.translate(0,-20); c.rotate(aim);
    c.fillStyle='rgba(150,175,200,.45)'; c.beginPath(); c.roundRect(6,-9,4,18,2); c.fill();
    c.strokeStyle='#8fa3b8'; c.lineWidth=1.2; c.stroke(); c.restore();
  }
  if(o.pack){ c.fillStyle='#2b2f36'; c.beginPath(); c.roundRect(-9.5,-25,4.4,10,2); c.fill();
    c.strokeStyle='#7d8794'; c.lineWidth=1.2; c.beginPath(); c.moveTo(-7.3,-25); c.lineTo(-9.5,-38); c.stroke();
    c.fillStyle='#ff4d5e'; c.beginPath(); c.arc(-9.5,-38.6,1.5,0,7); c.fill(); }
  c.restore();
}

const DEC=document.createElement('canvas'); DEC.width=W*2; DEC.height=H*2;
const DX=DEC.getContext('2d'); DX.setTransform(2,0,0,2,0,0);
let decalCount=0;
function fadeDecals(){
  DX.save(); DX.setTransform(1,0,0,1,0,0);
  DX.globalCompositeOperation='destination-out';
  DX.fillStyle='rgba(0,0,0,.35)'; DX.fillRect(0,0,DEC.width,DEC.height);

function splat(x,y,amt,dir,col){
  if(!G.gore) return;
  const c=col||'rgba(112,10,16,';
  for(let i=0;i<amt;i++){
    const a=(dir!==undefined? dir+rnd(-.9,.9) : rnd(0,6.283)), d=rnd(0,4+amt*1.5);
    const px=x+Math.cos(a)*d, py=y+Math.sin(a)*d*.6;
    DX.fillStyle=c+rnd(.35,.8)+')';
    DX.beginPath(); DX.ellipse(px,py,rnd(.8,2.6+amt*.18),rnd(.6,1.9+amt*.14),a,0,7); DX.fill();
  }
  DX.fillStyle=c+'.5)';
  DX.beginPath(); DX.ellipse(x,y,rnd(2,3+amt*.35),rnd(1.4,2+amt*.25),rnd(0,3),0,7); DX.fill();
  if(++decalCount>520){ decalCount=300; fadeDecals(); }
}
function pool(x,y,r){
  if(!G.gore) return;
  const g=DX.createRadialGradient(x,y,0,x,y,r);
  g.addColorStop(0,'rgba(96,6,12,.92)'); g.addColorStop(.7,'rgba(86,5,10,.7)'); g.addColorStop(1,'rgba(70,4,8,0)');
  DX.fillStyle=g; DX.beginPath(); DX.ellipse(x,y,r,r*.66,rnd(0,3),0,7); DX.fill();
  DX.fillStyle='rgba(150,20,26,.35)'; DX.beginPath(); DX.ellipse(x-r*.25,y-r*.2,r*.3,r*.18,0,0,7); DX.fill();
}
function corpse(x,y,look,scale){
  if(!G.gore){ splat(x,y,4); return; }
  pool(x,y+2,7*(scale||1));
  const o=Object.assign({},look,{dead:true,moving:false,rot:rnd(1.1,1.9)*(Math.random()<.5?1:-1),
    s:(look.s||1)*(scale||1),flash:0,gun:null,hood:false,
    cloth:shade(look.cloth||'#54613a',-.28), skin:shade(look.skin||'#c39268',-.22), eyes:false});
  DX.save();
  DX.shadowColor='rgba(0,0,0,.85)'; DX.shadowBlur=6;
  person(DX,x,y,o);
  DX.restore();
  splat(x,y,6);
  if(++decalCount>520){ decalCount=300; fadeDecals(); }
}
/* ---------- particles ---------- */
function part(x,y,vx,vy,life,col,r,kind){
  if(G.parts.length>700) return;
  G.parts.push({x,y,vx,vy,life,max:life,col,r,kind});
}
function bloodBurst(x,y,n,dir,power){
  if(!G.gore) return;
  for(let i=0;i<n;i++){
    const a=(dir!==undefined?dir+rnd(-.8,.8):rnd(0,6.283)), sp=rnd(20,60)*(power||1);
    part(x,y,Math.cos(a)*sp,Math.sin(a)*sp-rnd(0,30),rnd(.35,.8),'#8e0d16',rnd(.9,2.3),'blood');
  }
}
function updateParts(dt){
  for(const p of G.parts){
    p.life-=dt; p.x+=p.vx*dt; p.y+=p.vy*dt;
    if(p.kind!=='smoke') p.vy+=190*dt; else { p.vy-=12*dt; p.vx*=.97; }
    if(p.life<=0 && p.kind==='blood'){
      DX.fillStyle='rgba(112,10,16,'+rnd(.4,.75)+')';
      DX.beginPath(); DX.ellipse(p.x,p.y,p.r*rnd(.8,1.5),p.r*rnd(.6,1.1),rnd(0,3),0,7); DX.fill();
      if(++decalCount>520){ decalCount=300; fadeDecals(); }
    }
  }
  G.parts=G.parts.filter(p=>p.life>0);
}

function drawTower(t,ghost){

  X.save(); if(ghost) X.globalAlpha=.6;
  drawPad(t);
  if(MP.on && !ghost && t.owner!==undefined){        // whose officer is this?
    X.save(); X.strokeStyle=OWNCOL[t.owner]||OWNCOL[0]; X.globalAlpha=.9; X.lineWidth=1.8;
    X.beginPath(); X.ellipse(t.x,t.y+5,20,11,0,0,7); X.stroke(); X.restore();
  }
  const o=Object.assign({},look,{aim:t.ang,ph:0,moving:false,flash:t.flash||0,s:(look.s||1)*1.05});
  if(t.heroPunch||look.cape){                        // cape idles, fist snaps out on the swing
    o.ph = G.time*0.42;
    o.punchArm = Math.sin(clamp(((t.swing||0)-G.time)/0.24,0,1)*Math.PI);

  person(X,t.x,t.y+6,o);

function drawEnemy(e){
  const p=epos(e), t=G.time;
  const hidden = e.stealth && !G.globalDetect &&
    !G.towers.some(w=>(w.detect||w.bDet)&&Math.hypot(w.x-p.x,w.y-p.y)<=w.range);
  X.save();
  if(hidden) X.globalAlpha=.34;
  if(e.type==='van'){ drawVan(e,p); }
  else {
    const look=LOOK[e.type]||LOOK.thug;
    const moving = !(e.stunU>t) && !e.flee;
    e.ph=(e.ph||Math.random())+(moving? (e.base*(e.slowU>t?1-e.slow:1))*0.0022 :0);
    const o=Object.assign({},look,{aim:e.flee?p.ang+Math.PI:p.ang, ph:e.ph, moving,
      s:(look.s||1)*(e.boss?1+e.k*0.06:1)});
    if(e.redEyes){                                    // pulsing scarlet wash at the feet, then lit eyes
      o.eyeCol='#ff3a44'; o.eyeGlow='#ff2b3a';
      X.save();
      X.globalAlpha=(hidden?.34:1)*(.20+Math.sin(t*4.2+e.wob)*.07);
      X.fillStyle='#ff2b3a';
      X.beginPath(); X.ellipse(p.x,p.y+6,e.r*1.05,e.r*.46,0,0,7); X.fill();
      X.restore();
    }
    person(X,p.x,p.y+ (e.boss?10:6), o);
    if(e.flash>t){
      X.globalAlpha=Math.min(.5,(e.flash-t)*5)*(hidden?.34:1);
      X.fillStyle='#ffe2e2';
      X.beginPath(); X.ellipse(p.x,p.y-20*(look.s||1),4.5*(look.s||1),7*(look.s||1),0,0,7); X.fill();
      X.globalAlpha=hidden?.34:1;
    }
  }
  /* status rings */
  if(e.slowU>t){ X.strokeStyle='rgba(120,200,255,.75)'; X.lineWidth=2;
    X.beginPath(); X.ellipse(p.x,p.y+5,e.r+3,(e.r+3)*.5,0,0,7); X.stroke(); }
  if(e.burnU>t){ for(let i=0;i<3;i++){ X.fillStyle='rgba(255,'+(120+Math.random()*100|0)+',40,.8)';
    X.beginPath(); X.arc(p.x+rnd(-6,6),p.y-rnd(8,34),rnd(1.4,3),0,7); X.fill(); } }
  if(e.stunU>t){ X.strokeStyle='#ffe066'; X.lineWidth=1.6;
    for(let i=0;i<3;i++){ const a=t*5+i*2.1; X.beginPath();
      X.arc(p.x+Math.cos(a)*8,p.y-44+Math.sin(a)*3,1.8,0,7); X.stroke(); } }
  if(e.markU>t){ X.strokeStyle='#ff4d5e'; X.lineWidth=1.4;
    X.beginPath(); X.arc(p.x,p.y-18,e.r+9,0,7); X.stroke();
    X.beginPath(); X.moveTo(p.x-e.r-14,p.y-18); X.lineTo(p.x-e.r-5,p.y-18);
    X.moveTo(p.x+e.r+5,p.y-18); X.lineTo(p.x+e.r+14,p.y-18); X.stroke(); }
  /* health bar */
  if(e.hp<e.max && !e.boss){
    const w=Math.max(16,e.r*2.4), yy=p.y-(e.type==='van'?26:48);
    X.fillStyle='rgba(0,0,0,.7)'; X.fillRect(p.x-w/2-1,yy-1,w+2,4.6);
    X.fillStyle=e.hp/e.max>.5?'#63c96b':e.hp/e.max>.22?'#e0b23c':'#d64152';
    X.fillRect(p.x-w/2,yy,w*clamp(e.hp/e.max,0,1),2.6);
  }
  if(e.boss){
    X.fillStyle='rgba(0,0,0,.55)'; X.font='bold 9px sans-serif'; X.textAlign='center';
    X.fillText('BADDY BOSS BEN',p.x+1,p.y-59);
    X.fillStyle='#ffcc4d'; X.fillText('BADDY BOSS BEN',p.x,p.y-60); X.textAlign='left';
  }
  X.restore();
}
function drawFx(f){
  const k=f.t/f.max;
  X.save();
  if(f.type==='boom'){
    X.globalAlpha=(1-k)*.95;
    const g=X.createRadialGradient(f.x,f.y,0,f.x,f.y,f.r*(0.4+k));
    g.addColorStop(0,'#fff2c0'); g.addColorStop(.4,f.col); g.addColorStop(1,'rgba(60,30,10,0)');
    X.fillStyle=g; X.beginPath(); X.arc(f.x,f.y,f.r*(0.4+k),0,7); X.fill();
    X.globalAlpha=(1-k)*.6; X.strokeStyle='#ffe9a8'; X.lineWidth=2;
    X.beginPath(); X.arc(f.x,f.y,f.r*(0.5+k*1.1),0,7); X.stroke();
  } else if(f.type==='puff'){
    X.globalAlpha=(1-k)*.55; X.fillStyle=f.col;
    X.beginPath(); X.arc(f.x,f.y,f.r*(1+k*1.8),0,7); X.fill();
  } else if(f.type==='ring'||f.type==='shock'){
    X.globalAlpha=(1-k); X.strokeStyle=f.col; X.lineWidth=f.type==='shock'?6:2.5;
    X.beginPath(); X.ellipse(f.x,f.y,f.r*(f.type==='shock'?k:1),f.r*(f.type==='shock'?k:1)*.62,0,0,7); X.stroke();
  } else if(f.type==='beam'){
    X.globalAlpha=1-k; X.strokeStyle=f.col; X.lineWidth=2.6; X.shadowColor=f.col; X.shadowBlur=14;
    X.beginPath(); f.pts.forEach((p,i)=>{ if(!i) X.moveTo(p.x,p.y-16);
      else X.lineTo(p.x+rnd(-4,4),p.y-16+rnd(-4,4)); }); X.stroke();
  } else if(f.type==='txt'){
    X.globalAlpha=clamp(1.6-k*1.6,0,1);
    X.font='bold 12px sans-serif'; X.textAlign='center';
    X.fillStyle='rgba(0,0,0,.6)'; X.fillText(f.txt,f.x+1,f.y-k*24+1);
    X.fillStyle=f.col; X.fillText(f.txt,f.x,f.y-k*24); X.textAlign='left';
  } else if(f.type==='pool'){
    X.globalAlpha=(1-k)*.6; X.fillStyle='#ff7a2f';
    X.beginPath(); X.ellipse(f.x,f.y,f.r,f.r*.6,0,0,7); X.fill();
    X.globalAlpha=(1-k)*.9;
    for(let i=0;i<7;i++){ X.fillStyle=Math.random()<.5?'#ffd45e':'#ff8a2f';
      X.beginPath(); X.arc(f.x+rnd(-f.r,f.r),f.y+rnd(-f.r*.6,f.r*.6)-rnd(0,8),rnd(1.5,3.6),0,7); X.fill(); }
  } else if(f.type==='strike'){
    if(f.t<.65){ X.globalAlpha=.85; X.strokeStyle='#ff4d5e'; X.lineWidth=2;
      X.beginPath(); X.ellipse(f.x,f.y,62+Math.sin(f.t*22)*6,40+Math.sin(f.t*22)*4,0,0,7); X.stroke();
      X.beginPath(); X.moveTo(f.x-74,f.y); X.lineTo(f.x+74,f.y);
      X.moveTo(f.x,f.y-48); X.lineTo(f.x,f.y+48); X.stroke();
      X.fillStyle='#ff4d5e'; X.font='bold 10px sans-serif'; X.textAlign='center';
      X.fillText('AIRSTRIKE INBOUND',f.x,f.y-54); X.textAlign='left';
    } else { const kk=(f.t-.65)/(f.max-.65);
      X.globalAlpha=1-kk;
      const g=X.createRadialGradient(f.x,f.y,0,f.x,f.y,132*(0.4+kk));
      g.addColorStop(0,'#fff'); g.addColorStop(.35,'#ffb03a'); g.addColorStop(1,'rgba(80,40,10,0)');
      X.fillStyle=g; X.beginPath(); X.arc(f.x,f.y,132*(0.4+kk),0,7); X.fill(); }
  }
  X.restore();
}
function render(){
  X.setTransform(1,0,0,1,0,0);
  X.fillStyle='#0b0d0a'; X.fillRect(0,0,W,H);
  X.save();
  X.setTransform(CAM.z,0,0,CAM.z, W/2-CAM.x*CAM.z, H/2-CAM.y*CAM.z);
  X.drawImage(BG,0,0,W,H);
  X.drawImage(DEC,0,0,W,H);
  /* build overlay */
  if(G.place){
    const h=G.hover;
    const reach=TOWERS[G.place].range;
    for(let rr=0;rr<ROWS;rr++) for(let cc=0;cc<COLS;cc++){
      if(!BUILDABLE[rr][cc]||occupied(cc,rr)) continue;
      const covers = CELLDIST[rr][cc] < reach;
      X.fillStyle = covers?'rgba(90,230,150,.16)':'rgba(120,130,145,.07)';
      X.fillRect(cc*CS+3,rr*CS+3,CS-6,CS-6);
      if(!covers){
        X.strokeStyle='rgba(150,160,175,.16)'; X.lineWidth=1;
        X.beginPath(); X.moveTo(cc*CS+14,rr*CS+14); X.lineTo(cc*CS+CS-14,rr*CS+CS-14); X.stroke();
      }
    }
    if(h && h.c>=0&&h.c<COLS&&h.r>=0&&h.r<ROWS){
      const ok=canPlace(h.c,h.r)&&G.cash>=unitCost(G.place);
      if(TOWERS[G.place].range<900){
        X.fillStyle='rgba(63,169,255,.10)'; X.beginPath();
        X.arc((h.c+.5)*CS,(h.r+.5)*CS,TOWERS[G.place].range,0,7); X.fill();
        X.strokeStyle='rgba(63,169,255,.6)'; X.lineWidth=1.5/CAM.z*2; X.stroke();
      }
      X.fillStyle=ok?'rgba(90,230,150,.3)':'rgba(255,77,94,.34)';
      X.fillRect(h.c*CS,h.r*CS,CS,CS);
      X.strokeStyle=ok?'#4ade80':'#ff4d5e'; X.lineWidth=2; X.strokeRect(h.c*CS+1,h.r*CS+1,CS-2,CS-2);
      if(ok) drawTower({key:G.place,def:TOWERS[G.place],x:(h.c+.5)*CS,y:(h.r+.5)*CS,ang:0,up:[0,0],disabled:0},true);
    }
  }
  if(G.sel){
    if(G.sel.range<900){
      X.fillStyle='rgba(63,169,255,.09)'; X.beginPath(); X.arc(G.sel.x,G.sel.y,G.sel.range,0,7); X.fill();
      X.strokeStyle='rgba(63,169,255,.55)'; X.lineWidth=2; X.stroke();
    }
    X.strokeStyle='#3fa9ff'; X.lineWidth=1.6; X.strokeRect(G.sel.cx*CS+1,G.sel.cy*CS+1,CS-2,CS-2);
  }
  /* Super Hero auras stay drawn so you can see which units are standing in one */
  for(const s of G.towers){
    if(!s.support) continue;
    X.fillStyle='rgba(255,204,77,'+(.05+Math.sin(G.time*2+s.x)*.018).toFixed(3)+')';
    X.beginPath(); X.arc(s.x,s.y,s.range,0,7); X.fill();
    X.strokeStyle='rgba(255,204,77,.30)'; X.lineWidth=1.5; X.stroke();
  }
  for(const f of G.fx) if(f.type==='pool') drawFx(f);
  /* depth-sorted actors */
  const act=[];
  for(const t of G.towers) act.push({y:t.y,d:()=>drawTower(t,false)});
  for(const e of G.enemies) act.push({y:epos(e).y,d:()=>drawEnemy(e)});
  for(const a of G.army) if(a.x!==undefined) act.push({y:a.y,d:()=>drawArmy(a)});
  act.sort((a,b)=>a.y-b.y);
  for(const a of act) a.d();
  /* particles */
  for(const p of G.parts){
    X.globalAlpha=p.kind==='smoke'?clamp(p.life/p.max,0,1)*.45:clamp(p.life/p.max*1.6,0,1);
    X.fillStyle=p.col; X.beginPath(); X.arc(p.x,p.y,p.r,0,7); X.fill();
  }
  X.globalAlpha=1;
  for(const b of G.bullets){
    if(b.src.arc){ X.fillStyle='#c9bd8a'; X.beginPath(); X.arc(b.x,b.y-14,3.4,0,7); X.fill();
      X.fillStyle='rgba(0,0,0,.3)'; X.beginPath(); X.ellipse(b.x,b.y,3,1.4,0,0,7); X.fill(); }
    else { const a=Math.atan2(b.ty-b.y,b.tx-b.x);
      X.strokeStyle='rgba(255,232,160,.9)'; X.lineWidth=1.6;
      X.beginPath(); X.moveTo(b.x,b.y-14); X.lineTo(b.x-Math.cos(a)*9,b.y-14-Math.sin(a)*9); X.stroke(); }
  }
  for(const f of G.fx) if(f.type!=='pool') drawFx(f);
  X.restore();
  X.setTransform(1,0,0,1,0,0);
  /* vignette */
  const vg=X.createRadialGradient(W/2,H/2,H*.35,W/2,H/2,H*.95);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,.55)');
  X.fillStyle=vg; X.fillRect(0,0,W,H);
  /* an on-canvas START WAVE button — a second, independent way to send a wave */
  if(!G.over && G.mode==='play'){
    const r=waveBtnRect(), m=G.screen||{x:-1,y:-1};
    const hot = !G.running && m.x>=r.x&&m.x<=r.x+r.w&&m.y>=r.y&&m.y<=r.y+r.h;
    X.save();
    X.fillStyle = G.running?'rgba(28,34,44,.9)' : hot?'#39a064':'rgba(30,92,57,.94)';
    X.beginPath(); X.roundRect(r.x,r.y,r.w,r.h,9); X.fill();
    X.strokeStyle=G.running?'#3a4553':'#58c98a'; X.lineWidth=2; X.stroke();
    X.fillStyle=G.running?'#8ba0bb':'#eafff2';
    X.font='bold '+(G.running?13:16)+'px sans-serif'; X.textAlign='center';
    X.fillText(G.running?('WAVE '+G.wave+' IN PROGRESS'):('\u25b6  SEND WAVE '+(G.wave+1)),
      r.x+r.w/2, r.y+(G.running?25:27));
    X.textAlign='left'; X.restore();
  }
  /* standing instruction while nothing is deployed */
  if(!G.towers.length && !G.over){
    X.save();
    X.fillStyle='rgba(8,12,18,.82)';
    X.beginPath(); X.roundRect(W/2-250,14,500,54,10); X.fill();
    X.strokeStyle='#3fa9ff'; X.lineWidth=1.5; X.stroke();
    X.textAlign='center';
    X.fillStyle='#ffcc4d'; X.font='bold 15px sans-serif';
    X.fillText('No officers on the ground',W/2,36);
    X.fillStyle='#dfe7f2'; X.font='13px sans-serif';
    X.fillText('Click a unit on the right, then click the grass to place it',W/2,56);
    X.textAlign='left'; X.restore();
  }
  /* minimap */
  drawMini();
  if(G.paused && !G.over){
    X.fillStyle='rgba(0,0,0,.5)'; X.fillRect(0,0,W,H);
    X.fillStyle='#dfe7f2'; X.font='bold 34px sans-serif'; X.textAlign='center';
    X.fillText('PAUSED',W/2,H/2); X.textAlign='left';
  }
}
function waveBtnRect(){ return {x:W/2-115, y:H-56, w:230, h:40}; }
function drawMini(){
  const mw=150, mh=mw*H/W, mx=W-mw-10, my=H-mh-10, k=mw/W;
  X.save();
  X.globalAlpha=.82; X.fillStyle='#0b0f14';
  X.beginPath(); X.roundRect(mx,my,mw,mh,5); X.fill();
  X.strokeStyle='#2a3546'; X.lineWidth=1; X.stroke();
  X.globalAlpha=1;
  X.strokeStyle='#4a4740'; X.lineWidth=4*k*2.4; X.lineJoin='round'; X.lineCap='round';
  X.beginPath(); PATH.forEach((p,i)=>i?X.lineTo(mx+p.x*k,my+p.y*k):X.moveTo(mx+p.x*k,my+p.y*k)); X.stroke();
  X.fillStyle='#5a5a52'; X.fillRect(mx+BASE_RECT.x*k,my+BASE_RECT.y*k,BASE_RECT.w*k,BASE_RECT.h*k);
  for(const t of G.towers){ X.fillStyle=t.def.color; X.fillRect(mx+t.x*k-1.5,my+t.y*k-1.5,3,3); }
  for(const e of G.enemies){ const p=epos(e);
    X.fillStyle=e.boss?'#ff2d4b':'#ffcc4d'; X.fillRect(mx+p.x*k-1,my+p.y*k-1,e.boss?4:2,e.boss?4:2); }
  const {hw,hh}=camLimits(CAM.z);
  X.strokeStyle='rgba(255,255,255,.7)'; X.lineWidth=1;
  X.strokeRect(mx+(CAM.x-hw)*k,my+(CAM.y-hh)*k,hw*2*k,hh*2*k);
  X.restore();
}

const $=id=>document.getElementById(id);
function repairCost(){ return 350 + G.repairs*300; }
function doRepair(){
  if(G.over) return;
  if(MP.role==='client'){ NET.send({k:'rep'}); return; }
  if(G.mode!=='play' && !MP.actor) return;
  if(G.integ>=100){ toast('Base health is already full'); SFX.nope(); return; }
  const c=repairCost();
  if(G.cash<c){ SFX.nope(); toast('Not enough funds'); return; }
  G.cash-=c; G.repairs++; G.integ=Math.min(100,G.integ+8);
  SFX.buy(); log(`Engineers patch the perimeter. <b>+8 health</b> (-$${c})`,'good');
  syncHUD(); renderShop(); renderSel();
}
function syncHUD(){
  $('hCash').textContent='$'+Math.floor(G.cash).toLocaleString();
  $('hInt').textContent=Math.max(0,Math.ceil(G.integ));
  $('hInt').style.color = G.integ>50?'var(--txt)':G.integ>20?'var(--gold)':'var(--red)';
  $('hWave').textContent=G.wave+' / '+FINAL_WAVE;
  const b=$('bStart');
  b.disabled=G.over||G.running;
  b.textContent = G.over?'—'
    : G.running?`Wave ${G.wave} in progress…`
    : `Send Wave ${G.wave+1}${(G.wave+1)%10===0?' ☠':''}`;
  const rb=$('bRepair');
  rb.textContent='🛠 +8 ($'+repairCost()+')';
  rb.disabled = G.over || G.integ>=100 || G.cash<repairCost();
  const bh=$('bosshp');
  if(G.boss&&G.boss.alive){ bh.style.display='block';
    const p=clamp(G.boss.hp/G.boss.max,0,1);
    $('bFill').style.width=(p*100).toFixed(1)+'%';
    $('bPct').textContent=Math.ceil(p*100)+'%';
    const bp=G.boss.P;
    $('bName').textContent = 'BADDY BOSS BEN \u2014 APPEARANCE '+G.boss.k
      + (bp ? ' \u00b7 ' + (bp.anyType?'RALLY ANY':'RALLY') + (bp.stun?' \u00b7 SHOCKWAVE':'') : '');
  } else bh.style.display='none';
}
function log(msg,cls){
  mpMirrorLog(msg,cls);                 // co-op: the field report is shared
  const d=document.createElement('div'); if(cls) d.className=cls; d.innerHTML=msg;
  const L=$('log'); L.appendChild(d); L.scrollTop=L.scrollHeight;
  while(L.children.length>60) L.removeChild(L.firstChild);
}
let toastT=0;
function toast(m){
  /* a nudge caused by the partner's click belongs on the partner's screen */
  if(MP.on && MP.role==='host' && MP.actor===1){ NET.send({k:'toast',m,n:1}); return; }
  const e=$('toast'); e.textContent=m; e.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>e.classList.remove('show'),1400); }
function taunt(txt,vo){

function renderShop(){

  let h=`<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">

  } else if(t.support){

        <div class="kv"><span>Aura radius</span><b>${Math.round(t.range)}</b></div>

    if(htags.length) h+=`<div style="font-size:11px;color:var(--acc);margin:4px 0">${htags.join(' \u00b7 ')}</div>`;
  }else{
    h+=`<div class="kv"><span>Damage</span><b>${eDmg(t).toFixed(1)}${t.pierce?' (AP)':''}${t.bDmg?' ↑':''}</b></div>
        <div class="kv"><span>Fire rate</span><b>${eRate(t).toFixed(2)}/s${t.bRate?' ↑':''}</b></div>
        <div class="kv"><span>Range</span><b>${t.range>=900?'whole map':Math.round(t.range)}</b></div>
        <div class="kv"><span>DPS (single)</span><b>${(eDmg(t)*eRate(t)*t.shots*Math.max(1,t.multi)).toFixed(0)}</b></div>
        <div class="kv"><span>Kills</span><b>${t.kills}</b></div>`;
    const tags=[];
    if(t.splash) tags.push('splash '+Math.round(t.splash));

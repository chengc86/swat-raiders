  X.save(); X.rotate(0); X.fillText('BBB CREW',-4,3); X.restore(); X.textAlign='left';
  X.fillStyle='#ffe9a8'; X.beginPath(); X.arc(21,-7,2.2,0,7); X.arc(21,7,2.2,0,7); X.fill();
  X.restore();
}
function drawEnemy(e){
  const p=epos(e), t=G.time;
  const hidden = e.stealth && !G.globalDetect &&
    !G.towers.some(w=>(w.detect||w.bDet)&&Math.hypot(w.x-p.x,w.y-p.y)<=eRange(w));
  X.save();
  if(hidden) X.globalAlpha=.34;
  if(e.type==='van'){ drawVan(e,p); }
  else {
    const look=LOOK[e.type]||LOOK.thug;
    const moving = !(e.stunU>t) && !e.flee;
    e.ph=(e.ph||Math.random())+(moving? (e.base*(e.slowU>t?1-e.slow:1))*0.0022 :0);
    const o=Object.assign({},look,{aim:e.flee?p.ang+Math.PI:p.ang, ph:e.ph, moving,
      s:(look.s||1)*(e.boss?1+e.k*0.06:1)});
    if(e.redEyes){                                    // pulsing scarlet wash at the feet, then lit eyes
      o.eyeCol='#ff3a44'; o.eyeGlow='#ff2b3a';
      X.save();
      X.globalAlpha=(hidden?.34:1)*(.20+Math.sin(t*4.2+e.wob)*.07);
      X.fillStyle='#ff2b3a';
      X.beginPath(); X.ellipse(p.x,p.y+6,e.r*1.05,e.r*.46,0,0,7); X.fill();
      X.restore();
    }
    person(X,p.x,p.y+ (e.boss?10:6), o);
    if(e.flash>t){
      X.globalAlpha=Math.min(.5,(e.flash-t)*5)*(hidden?.34:1);
      X.fillStyle='#ffe2e2';
      X.beginPath(); X.ellipse(p.x,p.y-20*(look.s||1),4.5*(look.s||1),7*(look.s||1),0,0,7); X.fill();
      X.globalAlpha=hidden?.34:1;
    }
  }
  /* status rings */
  if(e.slowU>t){ X.strokeStyle='rgba(120,200,255,.75)'; X.lineWidth=2;
    X.beginPath(); X.ellipse(p.x,p.y+5,e.r+3,(e.r+3)*.5,0,0,7); X.stroke(); }
  if(e.burnU>t){ for(let i=0;i<3;i++){ X.fillStyle='rgba(255,'+(120+Math.random()*100|0)+',40,.8)';
    X.beginPath(); X.arc(p.x+rnd(-6,6),p.y-rnd(8,34),rnd(1.4,3),0,7); X.fill(); } }
  if(e.stunU>t){ X.strokeStyle='#ffe066'; X.lineWidth=1.6;
    for(let i=0;i<3;i++){ const a=t*5+i*2.1; X.beginPath();
      X.arc(p.x+Math.cos(a)*8,p.y-44+Math.sin(a)*3,1.8,0,7); X.stroke(); } }
  if(e.markU>t){ X.strokeStyle='#ff4d5e'; X.lineWidth=1.4;
    X.beginPath(); X.arc(p.x,p.y-18,e.r+9,0,7); X.stroke();
    X.beginPath(); X.moveTo(p.x-e.r-14,p.y-18); X.lineTo(p.x-e.r-5,p.y-18);
    X.moveTo(p.x+e.r+5,p.y-18); X.lineTo(p.x+e.r+14,p.y-18); X.stroke(); }
  /* health bar */
  if(e.hp<e.max && !e.boss){
    const w=Math.max(16,e.r*2.4), yy=p.y-(e.type==='van'?26:48);
    X.fillStyle='rgba(0,0,0,.7)'; X.fillRect(p.x-w/2-1,yy-1,w+2,4.6);
    X.fillStyle=e.hp/e.max>.5?'#63c96b':e.hp/e.max>.22?'#e0b23c':'#d64152';
    X.fillRect(p.x-w/2,yy,w*clamp(e.hp/e.max,0,1),2.6);
  }
  if(e.boss){
    X.fillStyle='rgba(0,0,0,.55)'; X.font='bold 9px sans-serif'; X.textAlign='center';
    X.fillText('BADDY BOSS BEN',p.x+1,p.y-59);
    X.fillStyle='#ffcc4d'; X.fillText('BADDY BOSS BEN',p.x,p.y-60); X.textAlign='left';
  }
  X.restore();
}
function drawFx(f){
  const k=f.t/f.max;
  X.save();
  if(f.type==='boom'){
    X.globalAlpha=(1-k)*.95;
    const g=X.createRadialGradient(f.x,f.y,0,f.x,f.y,f.r*(0.4+k));
    g.addColorStop(0,'#fff2c0'); g.addColorStop(.4,f.col); g.addColorStop(1,'rgba(60,30,10,0)');
    X.fillStyle=g; X.beginPath(); X.arc(f.x,f.y,f.r*(0.4+k),0,7); X.fill();
    X.globalAlpha=(1-k)*.6; X.strokeStyle='#ffe9a8'; X.lineWidth=2;
    X.beginPath(); X.arc(f.x,f.y,f.r*(0.5+k*1.1),0,7); X.stroke();
  } else if(f.type==='puff'){
    X.globalAlpha=(1-k)*.55; X.fillStyle=f.col;
    X.beginPath(); X.arc(f.x,f.y,f.r*(1+k*1.8),0,7); X.fill();
  } else if(f.type==='ring'||f.type==='shock'){
    X.globalAlpha=(1-k); X.strokeStyle=f.col; X.lineWidth=f.type==='shock'?6:2.5;
    X.beginPath(); X.ellipse(f.x,f.y,f.r*(f.type==='shock'?k:1),f.r*(f.type==='shock'?k:1)*.62,0,0,7); X.stroke();
  } else if(f.type==='beam'){
    X.globalAlpha=1-k; X.strokeStyle=f.col; X.lineWidth=2.6; X.shadowColor=f.col; X.shadowBlur=14;
    X.beginPath(); f.pts.forEach((p,i)=>{ if(!i) X.moveTo(p.x,p.y-16);
      else X.lineTo(p.x+rnd(-4,4),p.y-16+rnd(-4,4)); }); X.stroke();
  } else if(f.type==='txt'){
    X.globalAlpha=clamp(1.6-k*1.6,0,1);
    X.font='bold 12px sans-serif'; X.textAlign='center';
    X.fillStyle='rgba(0,0,0,.6)'; X.fillText(f.txt,f.x+1,f.y-k*24+1);
    X.fillStyle=f.col; X.fillText(f.txt,f.x,f.y-k*24); X.textAlign='left';
  } else if(f.type==='pool'){
    X.globalAlpha=(1-k)*.6; X.fillStyle='#ff7a2f';
    X.beginPath(); X.ellipse(f.x,f.y,f.r,f.r*.6,0,0,7); X.fill();
    X.globalAlpha=(1-k)*.9;
    for(let i=0;i<7;i++){ X.fillStyle=Math.random()<.5?'#ffd45e':'#ff8a2f';
      X.beginPath(); X.arc(f.x+rnd(-f.r,f.r),f.y+rnd(-f.r*.6,f.r*.6)-rnd(0,8),rnd(1.5,3.6),0,7); X.fill(); }
  } else if(f.type==='strike'){
    if(f.t<.65){ X.globalAlpha=.85; X.strokeStyle='#ff4d5e'; X.lineWidth=2;
      X.beginPath(); X.ellipse(f.x,f.y,62+Math.sin(f.t*22)*6,40+Math.sin(f.t*22)*4,0,0,7); X.stroke();
      X.beginPath(); X.moveTo(f.x-74,f.y); X.lineTo(f.x+74,f.y);
      X.moveTo(f.x,f.y-48); X.lineTo(f.x,f.y+48); X.stroke();
      X.fillStyle='#ff4d5e'; X.font='bold 10px sans-serif'; X.textAlign='center';
      X.fillText('AIRSTRIKE INBOUND',f.x,f.y-54); X.textAlign='left';
    } else { const kk=(f.t-.65)/(f.max-.65);
      X.globalAlpha=1-kk;
      const g=X.createRadialGradient(f.x,f.y,0,f.x,f.y,132*(0.4+kk));
      g.addColorStop(0,'#fff'); g.addColorStop(.35,'#ffb03a'); g.addColorStop(1,'rgba(80,40,10,0)');
      X.fillStyle=g; X.beginPath(); X.arc(f.x,f.y,132*(0.4+kk),0,7); X.fill(); }
  }
  X.restore();
}
function render(){
  X.setTransform(1,0,0,1,0,0);
  X.fillStyle='#0b0d0a'; X.fillRect(0,0,W,H);
  X.save();
  X.setTransform(CAM.z,0,0,CAM.z, W/2-CAM.x*CAM.z, H/2-CAM.y*CAM.z);
  X.drawImage(BG,0,0,W,H);
  X.drawImage(DEC,0,0,W,H);
  /* build overlay */
  if(G.place){
    const h=G.hover;
    const reach=TOWERS[G.place].range;
    for(let rr=0;rr<ROWS;rr++) for(let cc=0;cc<COLS;cc++){
      if(!BUILDABLE[rr][cc]||occupied(cc,rr)) continue;
      const covers = CELLDIST[rr][cc] < reach;
      X.fillStyle = covers?'rgba(90,230,150,.16)':'rgba(120,130,145,.07)';
      X.fillRect(cc*CS+3,rr*CS+3,CS-6,CS-6);
      if(!covers){
        X.strokeStyle='rgba(150,160,175,.16)'; X.lineWidth=1;
        X.beginPath(); X.moveTo(cc*CS+14,rr*CS+14); X.lineTo(cc*CS+CS-14,rr*CS+CS-14); X.stroke();
      }
    }
    if(h && h.c>=0&&h.c<COLS&&h.r>=0&&h.r<ROWS){
      const ok=canPlace(h.c,h.r)&&G.cash>=unitCost(G.place);
      if(TOWERS[G.place].range<900){
        X.fillStyle='rgba(63,169,255,.10)'; X.beginPath();
        X.arc((h.c+.5)*CS,(h.r+.5)*CS,TOWERS[G.place].range,0,7); X.fill();
        X.strokeStyle='rgba(63,169,255,.6)'; X.lineWidth=1.5/CAM.z*2; X.stroke();
      }
      X.fillStyle=ok?'rgba(90,230,150,.3)':'rgba(255,77,94,.34)';
      X.fillRect(h.c*CS,h.r*CS,CS,CS);
      X.strokeStyle=ok?'#4ade80':'#ff4d5e'; X.lineWidth=2; X.strokeRect(h.c*CS+1,h.r*CS+1,CS-2,CS-2);
      if(ok) drawTower({key:G.place,def:TOWERS[G.place],x:(h.c+.5)*CS,y:(h.r+.5)*CS,ang:0,up:[0,0],disabled:0,
        roadAng:posAt(pathDistNear((h.c+.5)*CS,(h.r+.5)*CS)).ang},true);
    }
  }
  if(G.sel){
    if(eRange(G.sel)<900){
      X.fillStyle='rgba(63,169,255,.09)'; X.beginPath(); X.arc(G.sel.x,G.sel.y,eRange(G.sel),0,7); X.fill();
      X.strokeStyle='rgba(63,169,255,.55)'; X.lineWidth=2; X.stroke();
    }
    X.strokeStyle='#3fa9ff'; X.lineWidth=1.6; X.strokeRect(G.sel.cx*CS+1,G.sel.cy*CS+1,CS-2,CS-2);
  }
  /* Support auras stay drawn so you can see which units are standing in one */
  for(const s of G.towers){
    if(!s.support) continue;
    const ac=s.def.auraCol||'#ffcc4d';
    X.fillStyle=hexA(ac,(.05+Math.sin(G.time*2+s.x)*.018).toFixed(3));
    X.beginPath(); X.arc(s.x,s.y,s.range,0,7); X.fill();
    X.strokeStyle=hexA(ac,.30); X.lineWidth=1.5; X.stroke();
  }
  for(const f of G.fx) if(f.type==='pool') drawFx(f);
  for(const s of G.strips) drawStrip(s);
  /* depth-sorted actors */
  const act=[];
  for(const t of G.towers) act.push({y:t.y,d:()=>drawTower(t,false)});
  for(const e of G.enemies) act.push({y:epos(e).y,d:()=>drawEnemy(e)});
  for(const a of G.army) if(a.x!==undefined) act.push({y:a.y,d:()=>drawArmy(a)});
  act.sort((a,b)=>a.y-b.y);
  for(const a of act) a.d();
  /* particles */
  for(const p of G.parts){
    X.globalAlpha=p.kind==='smoke'?clamp(p.life/p.max,0,1)*.45:clamp(p.life/p.max*1.6,0,1);
    X.fillStyle=p.col; X.beginPath(); X.arc(p.x,p.y,p.r,0,7); X.fill();
  }
  X.globalAlpha=1;
  for(const b of G.bullets){
    if(b.src.arc){ X.fillStyle='#c9bd8a'; X.beginPath(); X.arc(b.x,b.y-14,3.4,0,7); X.fill();
      X.fillStyle='rgba(0,0,0,.3)'; X.beginPath(); X.ellipse(b.x,b.y,3,1.4,0,0,7); X.fill(); }
    else { const a=Math.atan2(b.ty-b.y,b.tx-b.x);
      X.strokeStyle='rgba(255,232,160,.9)'; X.lineWidth=1.6;
      X.beginPath(); X.moveTo(b.x,b.y-14); X.lineTo(b.x-Math.cos(a)*9,b.y-14-Math.sin(a)*9); X.stroke(); }
  }
  for(const f of G.fx) if(f.type!=='pool') drawFx(f);
  X.restore();
  X.setTransform(1,0,0,1,0,0);
  /* vignette */
  const vg=X.createRadialGradient(W/2,H/2,H*.35,W/2,H/2,H*.95);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,.55)');
  X.fillStyle=vg; X.fillRect(0,0,W,H);
  /* an on-canvas START WAVE button — a second, independent way to send a wave */
  if(!G.over && G.mode==='play'){
    const r=waveBtnRect(), m=G.screen||{x:-1,y:-1};
    const hot = !G.running && m.x>=r.x&&m.x<=r.x+r.w&&m.y>=r.y&&m.y<=r.y+r.h;
    X.save();
    X.fillStyle = G.running?'rgba(28,34,44,.9)' : hot?'#39a064':'rgba(30,92,57,.94)';
    X.beginPath(); X.roundRect(r.x,r.y,r.w,r.h,9); X.fill();
    X.strokeStyle=G.running?'#3a4553':'#58c98a'; X.lineWidth=2; X.stroke();
    X.fillStyle=G.running?'#8ba0bb':'#eafff2';
    X.font='bold '+(G.running?13:16)+'px sans-serif'; X.textAlign='center';
    X.fillText(G.running?('WAVE '+G.wave+' IN PROGRESS'):('\u25b6  SEND WAVE '+(G.wave+1)),
      r.x+r.w/2, r.y+(G.running?25:27));
    X.textAlign='left'; X.restore();
  }
  /* standing instruction while nothing is deployed */
  if(!G.towers.length && !G.over){
    X.save();
    X.fillStyle='rgba(8,12,18,.82)';
    X.beginPath(); X.roundRect(W/2-250,14,500,54,10); X.fill();
    X.strokeStyle='#3fa9ff'; X.lineWidth=1.5; X.stroke();
    X.textAlign='center';
    X.fillStyle='#ffcc4d'; X.font='bold 15px sans-serif';
    X.fillText('No officers on the ground',W/2,36);
    X.fillStyle='#dfe7f2'; X.font='13px sans-serif';
    X.fillText('Click a unit on the right, then click the grass to place it',W/2,56);
    X.textAlign='left'; X.restore();
  }
  /* minimap */
  drawMini();
  if(G.paused && !G.over){
    X.fillStyle='rgba(0,0,0,.5)'; X.fillRect(0,0,W,H);
    X.fillStyle='#dfe7f2'; X.font='bold 34px sans-serif'; X.textAlign='center';
    X.fillText('PAUSED',W/2,H/2); X.textAlign='left';
  }
}
function waveBtnRect(){ return {x:W/2-115, y:H-56, w:230, h:40}; }
function drawMini(){
  const mw=150, mh=mw*H/W, mx=W-mw-10, my=H-mh-10, k=mw/W;
  X.save();
  X.globalAlpha=.82; X.fillStyle='#0b0f14';
  X.beginPath(); X.roundRect(mx,my,mw,mh,5); X.fill();
  X.strokeStyle='#2a3546'; X.lineWidth=1; X.stroke();
  X.globalAlpha=1;
  X.strokeStyle='#4a4740'; X.lineWidth=4*k*2.4; X.lineJoin='round'; X.lineCap='round';
  X.beginPath(); PATH.forEach((p,i)=>i?X.lineTo(mx+p.x*k,my+p.y*k):X.moveTo(mx+p.x*k,my+p.y*k)); X.stroke();
  X.fillStyle='#5a5a52'; X.fillRect(mx+BASE_RECT.x*k,my+BASE_RECT.y*k,BASE_RECT.w*k,BASE_RECT.h*k);
  for(const t of G.towers){ X.fillStyle=t.def.color; X.fillRect(mx+t.x*k-1.5,my+t.y*k-1.5,3,3); }
  for(const e of G.enemies){ const p=epos(e);
    X.fillStyle=e.boss?'#ff2d4b':'#ffcc4d'; X.fillRect(mx+p.x*k-1,my+p.y*k-1,e.boss?4:2,e.boss?4:2); }
  const {hw,hh}=camLimits(CAM.z);
  X.strokeStyle='rgba(255,255,255,.7)'; X.lineWidth=1;
  X.strokeRect(mx+(CAM.x-hw)*k,my+(CAM.y-hh)*k,hw*2*k,hh*2*k);
  X.restore();
}

const $=id=>document.getElementById(id);
function repairCost(){ return 350 + G.repairs*300; }
function doRepair(){
  if(G.over) return;
  if(MP.role==='client'){ NET.send({k:'rep'}); return; }
  if(G.mode!=='play' && !MP.actor) return;
  if(G.integ>=100){ toast('Base health is already full'); SFX.nope(); return; }
  const c=repairCost();
  if(G.cash<c){ SFX.nope(); toast('Not enough funds'); return; }
  G.cash-=c; G.repairs++; G.integ=Math.min(100,G.integ+8);
  SFX.buy(); log(`Engineers patch the perimeter. <b>+8 health</b> (-$${c})`,'good');
  syncHUD(); renderShop(); renderSel();
}

/* Show the bottom fade only while there is genuinely something below, and drop
   it once the list is scrolled to the end — a permanent fade would just look
   like a smudge on a roster that already fits. */
function shopHint(){
  const s=$('shop'), w=$('shopWrap');
  if(!s||!w) return;
  const more = s.scrollHeight - s.scrollTop - s.clientHeight > 4;
  w.classList.toggle('more', more);

window.addEventListener('resize', shopHint);
/* ---------- keep the whole battlefield on screen ----------
   The stylesheet budgets a fixed strip for the HUD and the key hints, but the
   HUD wraps onto extra rows in a narrow window, which pushes the bottom of the
   map out of view. Measure what is actually left and cap the canvas by width —
   its aspect ratio does the rest. Capping by width rather than height matters:
   max-height on a replaced element is the one corner every engine treats
   differently, and Safari is the one that gets it wrong here. */
function fitStage(){
  if(!CV) return;
  CV.style.maxWidth='';                       // release the cap so we measure the real layout
  let top=0;                                  // document-relative, so scrolling cannot skew it
  for(let el=CV; el; el=el.offsetParent) top+=el.offsetTop;
  const hint=$('hint');
  const below=(hint&&hint.offsetHeight?hint.offsetHeight+6:0)+18;
  const vh=(window.visualViewport&&window.visualViewport.height)||window.innerHeight||600;
  const avail=Math.max(200, vh-top-below);
  CV.style.maxWidth=Math.min(W, Math.round(avail*(W/H)))+'px';
}
window.addEventListener('resize', fitStage);
window.addEventListener('orientationchange', ()=>setTimeout(fitStage,120));

function renderSel(){
  const box=$('selBody'), t=G.sel;
  if(!t){ box.innerHTML='<div style="color:var(--dim);font-size:12px">Click a deployed unit to inspect and upgrade it.</div>'; return; }
  const pips=p=>`<span class="pips">${[0,1,2].map(i=>`<span class="pip${i<t.up[p]?' f':''}"></span>`).join('')}</span>`;
  let h=`<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
      <span class="ic" style="width:28px;height:28px;display:grid;place-items:center;background:#0c1119;border:1px solid var(--line);border-radius:6px">${t.def.icon}</span>
      <b>${t.def.name}</b></div>`;
  if(t.stripCar){
    const live=G.strips.filter(x=>x.src===t).length;
    h+=`<div class="kv"><span>Damage a crossing</span><b>${eDmg(t).toFixed(0)} (AP)</b></div>
        <div class="kv"><span>Leaves them</span><b>${Math.round(t.stripSlow*100)}% slower for ${t.stripSlowT.toFixed(1)}s</b></div>
        <div class="kv"><span>Strips down</span><b>${live} / ${t.maxStrips}</b></div>
        <div class="kv"><span>A fresh one every</span><b>${t.regen.toFixed(1)}s</b></div>
        <div class="kv"><span>Kills</span><b>${t.kills}</b></div>
        <div style="font-size:11px;color:var(--acc);margin:4px 0">one baddy wrecks a strip &middot; punctures armour &middot; catches Terrorists too</div>`;
  } else if(t.dogs){
    h+=`<div class="kv"><span>Bite</span><b>${eDmg(t).toFixed(0)}</b></div>
        <div class="kv"><span>Pins them for</span><b>${(t.stun||0).toFixed(1)}s</b></div>
        <div class="kv"><span>Dogs sent</span><b>${Math.max(1,t.shots)} every ${(1/eRate(t)).toFixed(1)}s</b></div>
        <div class="kv"><span>Runs down the road</span><b>${Math.round(t.dogLeash)}</b></div>
        ${t.mark?`<div class="kv"><span>Bitten baddies take</span><b>+${Math.round((t.mark-1)*100)}% damage</b></div>`:''}
        <div class="kv"><span>Kills</span><b>${t.kills}</b></div>
        <div style="font-size:11px;color:var(--acc);margin:4px 0">the dog smells Terrorists &middot; the bite is meant to stop them, not kill them</div>`;
  } else if(t.spawner){
    h+=`<div class="kv"><span>Damage per man</span><b>${eDmg(t).toFixed(0)}</b></div>
        <div class="kv"><span>Men sent</span><b>${Math.max(1,t.shots)} every ${(1/eRate(t)).toFixed(1)}s</b></div>
        <div class="kv"><span>Each man survives</span><b>${t.manPierce} crash${t.manPierce>1?'es':''}</b></div>
        <div class="kv"><span>Marching speed</span><b>${t.manSpeed}</b></div>
        <div class="kv"><span>Kills</span><b>${t.kills}</b></div>
        <div style="font-size:11px;color:var(--red);margin:4px 0">cannot see Terrorists</div>`;
  } else if(t.support && !t.heroPunch){
    const inAura=G.towers.filter(o=>o!==t && Math.hypot(o.x-t.x,o.y-t.y)<=t.range).length;
    h+=`<div class="kv"><span>Own damage</span><b>none</b></div>
        <div class="kv"><span>Aura radius</span><b>${Math.round(t.range)}</b></div>
        <div class="kv"><span>Ally fire rate</span><b>+${Math.round(t.buffRate*100)}%</b></div>
        <div class="kv"><span>Ally range</span><b>+${Math.round(t.buffRange*100)}%</b></div>
        ${t.buffDmg?`<div class="kv"><span>Ally damage</span><b>+${Math.round(t.buffDmg*100)}%</b></div>`:''}
        <div class="kv"><span>Units in aura</span><b>${inAura}</b></div>`;
    if(t.buffDetect) h+=`<div style="font-size:11px;color:var(--acc);margin:4px 0">allies in aura can hit Terrorists</div>`;
  } else if(t.support){
    h+=`<div class="kv"><span>Punch damage</span><b>none</b></div>
        <div class="kv"><span>Punch slows by</span><b>${Math.round(t.slow*100)}% for ${t.slowT.toFixed(1)}s</b></div>
        <div class="kv"><span>Punches</span><b>${Math.max(1,t.multi)} every ${(1/eRate(t)).toFixed(1)}s</b></div>
        <div class="kv"><span>Aura radius</span><b>${Math.round(t.range)}</b></div>
        <div class="kv"><span>Ally damage</span><b>+${Math.round(t.buffDmg*100)}%</b></div>
        <div class="kv"><span>Ally fire rate</span><b>+${Math.round(t.buffRate*100)}%</b></div>`;
    const htags=[];
    if(t.punchR) htags.push('shockwave '+t.punchR);
    if(t.punchStun) htags.push('stuns '+t.punchStun+'s');
    if(t.buffDetect) htags.push('allies in aura can hit Terrorists');
    if(t.globalDetect) htags.push('EVERY unit can hit Terrorists');
    if(htags.length) h+=`<div style="font-size:11px;color:var(--acc);margin:4px 0">${htags.join(' \u00b7 ')}</div>`;
  }else{
    h+=`<div class="kv"><span>Damage</span><b>${eDmg(t).toFixed(1)}${t.pierce?' (AP)':''}${t.bDmg?' ↑':''}</b></div>
        <div class="kv"><span>Fire rate</span><b>${eRate(t).toFixed(2)}/s${t.bRate?' ↑':''}</b></div>
        <div class="kv"><span>Range</span><b>${eRange(t)>=900?'whole map':Math.round(eRange(t))}${t.bRange?' ↑':''}</b></div>
        <div class="kv"><span>DPS (single)</span><b>${(eDmg(t)*eRate(t)*t.shots*Math.max(1,t.multi)).toFixed(0)}</b></div>
        <div class="kv"><span>Kills</span><b>${t.kills}</b></div>`;
    const tags=[];
    if(t.splash) tags.push('splash '+Math.round(t.splash));
    if(t.burn) tags.push('burn '+t.burn+'/s');
    if(t.slow) tags.push('slow '+Math.round(t.slow*100)+'%');
    if(t.chain) tags.push('chain '+t.chain);
    if(t.stun) tags.push('stun');
    if(t.detect||t.bDet||t.globalDetect) tags.push('can hit Terrorists');
    if(t.bossMul>1) tags.push('×'+t.bossMul+' vs boss');
    if(t.weakVs) for(const k in t.weakVs)
      tags.push(Math.round(t.weakVs[k]*100)+'% damage vs '+ENEMIES[k].name+'s');
    if(t.mark) tags.push('marks targets');
    if(tags.length) h+=`<div style="font-size:11px;color:var(--acc);margin:4px 0">${tags.join(' · ')}</div>`;
  }
  for(let p=0;p<2;p++){
    h+=`<div class="pathhdr">${t.def.paths[p].name}${pips(p)}</div>`;
    const i=t.up[p];
    if(i>=3){ h+=`<div style="font-size:11px;color:var(--gold);padding:2px 0 4px">Path complete.</div>`; continue; }
    const tier=t.def.paths[p].tiers[i], ok=canUpgrade(t,p), afford=G.cash>=tier.c;
    h+=`<button class="up" data-p="${p}" ${(!ok||!afford)?'disabled':''}>
        <span><span class="t">${tier.n}</span><br><span class="d">${ok?tier.d:'Locked — one path is already fully upgraded.'}</span></span>
        <span class="c">$${tier.c}</span></button>`;
  }
  h+=`<div class="pathhdr">Targeting</div><div class="row">`;
  for(const m of ['first','last','close','strong'])
    h+=`<button data-tg="${m}" class="${t.target===m?'on':''}" style="padding:4px 9px;font-size:11px">${m}</button>`;
  h+=`</div><div style="margin-top:8px" class="row">
      <button class="sell" id="bSell" style="flex:1">Sell for $${towerValue(t)}</button></div>`;
  box.innerHTML=h;
  box.querySelectorAll('button[data-p]').forEach(b=>b.onclick=()=>buyUp(+b.dataset.p));
  box.querySelectorAll('button[data-tg]').forEach(b=>b.onclick=()=>{
    if(MP.role==='client'){ NET.send({k:'tgt',id:t.id,v:b.dataset.tg}); }
    t.target=b.dataset.tg; renderSel();});
  const bs=$('bSell'); if(bs) bs.onclick=sellSel;
}

function flame(c,x,y,sc,t,seed){
  c.save(); c.translate(x,y); c.scale(sc,sc);
  c.globalCompositeOperation='lighter';
  for(let i=0;i<7;i++){
    const ph=t*3.2+i*1.7+seed, h=26+Math.sin(ph)*10+i*3;
    const w=(9-i*0.8)+Math.sin(ph*1.7)*2.2;
    const g=c.createLinearGradient(0,0,0,-h);
    g.addColorStop(0,'rgba(255,140,20,.30)');
    g.addColorStop(.45,'rgba(255,90,10,.22)');
    g.addColorStop(1,'rgba(255,230,150,0)');
    c.fillStyle=g;
    c.beginPath();
    c.moveTo(-w,0);
    c.quadraticCurveTo(-w*1.1, -h*.55, Math.sin(ph)*4, -h);
    c.quadraticCurveTo(w*1.1, -h*.55, w, 0);
    c.closePath(); c.fill();
  }
  c.fillStyle='rgba(255,238,190,.5)';
  c.beginPath(); c.ellipse(0,-4,5+Math.sin(t*7+seed)*1.5,7,0,0,7); c.fill();
  c.globalCompositeOperation='source-over';
  for(let i=0;i<5;i++){
    const ph=(t*.5+i*.2+seed)%1;
    c.globalAlpha=(1-ph)*.28;
    c.fillStyle='#2c2a28';
    c.beginPath(); c.arc(Math.sin(ph*7+i)*10, -34-ph*60, 7+ph*18, 0,7); c.fill();
  }
  c.globalAlpha=1; c.restore();
}
function mkSplat(x,y,n,dir){
  const a=[];
  for(let i=0;i<n;i++){ const ang=(dir!==undefined?dir+rnd(-1,1):rnd(0,6.283)), d=rnd(0,6+n);
    a.push({x:x+Math.cos(ang)*d, y:y+Math.sin(ang)*d*.55, rx:rnd(1,3.4), ry:rnd(.8,2.4), r:rnd(0,3), al:rnd(.35,.85)}); }
  return a;
}
function drawSplat(a){
  for(const s of a){ X.fillStyle='rgba(112,10,16,'+s.al+')';
    X.beginPath(); X.ellipse(s.x,s.y,s.rx,s.ry,s.r,0,7); X.fill(); }
}
function drawCut(dt){
  const t = CUT.t;
  CUT.dec = CUT.dec || [];
  CUT.bodies = CUT.bodies || [];
  CUT.parts = CUT.parts || [];
  /* ---- camera keyframes: wide, then in tight for the killing ---- */
  const KF=[[0,600,386,1.3],[6.5,596,388,1.4],[9.5,486,400,1.55],[12,548,406,1.85],
            [13.4,540,408,2.0],[16,524,404,2.2],[27.4,520,402,2.25]];
  let cx=KF[0][1],cy=KF[0][2],cz=KF[0][3];
  for(let i=0;i<KF.length-1;i++){
    if(t>=KF[i][0]&&t<KF[i+1][0]){
      const k=(t-KF[i][0])/(KF[i+1][0]-KF[i][0]), e=k*k*(3-2*k);
      cx=KF[i][1]+(KF[i+1][1]-KF[i][1])*e; cy=KF[i][2]+(KF[i+1][2]-KF[i][2])*e;
      cz=KF[i][3]+(KF[i+1][3]-KF[i][3])*e; break;
    } else if(t>=KF[KF.length-1][0]){ cx=KF[KF.length-1][1]; cy=KF[KF.length-1][2]; cz=KF[KF.length-1][3]; }
  }
  const shake = (t>10.8&&t<13.6)?rnd(-1.6,1.6):0;
  X.setTransform(1,0,0,1,0,0);
  X.fillStyle='#05070a'; X.fillRect(0,0,W,H);
  X.save();
  X.setTransform(cz,0,0,cz, W/2-cx*cz+shake, H/2-cy*cz+shake);
  X.drawImage(CUTBG,0,0,W,H);

  /* ---- compound wall on the right ---- */
  X.fillStyle='#2b2e33'; X.fillRect(760,236,300,206);
  X.fillStyle='#34383e'; X.fillRect(760,236,300,14);
  for(let y=252;y<442;y+=11){ X.fillStyle='rgba(0,0,0,.18)'; X.fillRect(760,y,300,1.4); }
  X.fillStyle='#1b1f24'; X.fillRect(788,300,44,140);
  X.fillStyle='rgba(120,190,255,.10)'; X.fillRect(788,300,44,40);
  X.fillStyle='#d8c98a'; X.font='bold 13px monospace'; X.textAlign='center';
  X.fillText('SUPER DUPER SECRET C.I.A. BASE',900,274);
  X.fillStyle='#6f7466'; X.font='8px monospace';
  X.fillText('THIS SIGN DOES NOT EXIST EITHER',900,288); X.textAlign='left';
  X.fillStyle='#3a3f45'; X.fillRect(742,266,10,176);
  const blink=Math.sin(t*4)>0;
  X.fillStyle=blink?'#ff4d5e':'#3a1c22'; X.beginPath(); X.arc(747,262,3.4,0,7); X.fill();

        CUT.bodies.push({id:i,x:ox,y:oy,o});

      }

    }
    const firing = t>10.9;
    const flash = firing && ((Math.floor(t*9)+i)%4===0) ? rnd(.4,.9) : 0;
    person(X,ox,oy,{cloth:'#26456e',pants:'#1d2a3c',skin:['#c8996b','#8d6440','#d8b48c','#a97a52'][i],
      cap:'#1b3355',belt:true,gun:'pistol',aim:Math.PI, ph:t*2+i, moving:false, flash});
  });

  /* ---- BBB ---- */
  if(t>13.2){
    const bt=clamp((t-13.2)/3.4,0,1), be=bt*bt*(3-2*bt);
    const bx=250+be*190, by=474;
    person(X,bx,by,Object.assign({},LOOK.boss,{aim:.05,ph:t*1.3,moving:bt<1,s:2.0,flash:0}));
    if(t>16.4){
      X.fillStyle='rgba(0,0,0,.6)'; X.font='bold 10px monospace'; X.textAlign='center';
      X.fillText('BADDY BOSS BEN',bx+1,by-79);
      X.fillStyle='#ffcc4d'; X.fillText('BADDY BOSS BEN',bx,by-80); X.textAlign='left';
    }
  }
  /* ---- blood / debris particles ---- */
  for(const p of CUT.parts){
    p.l-=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=220*dt;
    if(p.l<=0 && !p.landed){ p.landed=true; CUT.dec.push(mkSplat(p.x,p.y,3)); }
  }
  CUT.parts=CUT.parts.filter(p=>p.l>0);
  for(const p of CUT.parts){ X.globalAlpha=clamp(p.l*2,0,1); X.fillStyle=p.c;
    X.beginPath(); X.arc(p.x,p.y,p.r,0,7); X.fill(); }
  X.globalAlpha=1;
  /* gun-smoke haze during the shooting */
  if(t>10.8&&t<14.5){ X.fillStyle='rgba(190,180,150,.05)'; X.fillRect(0,300,W+200,H); }
  X.restore();
  X.setTransform(1,0,0,1,0,0);

  /* muzzle wash */
  if(t>10.8 && t<13.6){ X.fillStyle='rgba(255,215,130,'+(Math.random()*.075)+')'; X.fillRect(0,0,W,H); }
  /* vignette + letterbox */
  const vg2=X.createRadialGradient(W/2,H/2,H*.3,W/2,H/2,H*.95);
  vg2.addColorStop(0,'rgba(0,0,0,0)'); vg2.addColorStop(1,'rgba(0,0,0,.72)');
  X.fillStyle=vg2; X.fillRect(0,0,W,H);
  X.fillStyle='#000'; X.fillRect(0,0,W,54); X.fillRect(0,H-96,W,96);
  const line=CS_LINES.find(l=>t>=l.a&&t<l.b);
  if(line && CUT.spoken!==line){
    /* only mark it spoken once it actually made a sound, so a line whose clip is
       still decoding gets another go on the next frame instead of being lost */
    if(playVO(line.vo, line.spk==='BADDY BOSS BEN' ? 'BEN' : line.spk==='DISPATCH' ? 'DISPATCH' : 'NARRATOR'))
      CUT.spoken=line;
  }
  if(line){
    const p=clamp((t-line.a)/0.9,0,1), shown=line.cap.slice(0,Math.ceil(line.cap.length*p));
    if(line.spk){ X.fillStyle=line.spk==='DISPATCH'?'#3fa9ff':'#ff4d5e';
      X.font='bold 13px monospace'; X.fillText(line.spk,40,H-58); }
    X.fillStyle='#dfe7f2'; X.font=(line.spk?'italic ':'')+'17px Georgia,serif';
    X.fillText(shown,40,H-32);
  }
  if(t<27.4){ X.fillStyle='#8ba0bb'; X.font='11px sans-serif'; X.textAlign='right';
    X.fillText('click or press SPACE to skip',W-16,H-14); X.textAlign='left'; }
  if(t<1.4){ X.fillStyle='rgba(0,0,0,'+(1-t/1.4)+')'; X.fillRect(0,0,W,H); }
  if(t>=27.4 && !CUT.done){ CUT.done=true; showTitle(); }
}

/* ============================================================
   CO-OP  —  menu, lobby, transport, host-authoritative sync
   ------------------------------------------------------------
   Two players share ONE battlefield: one grid, one wallet, one
   wave counter. The host runs the whole simulation and ships
   compact snapshots 20x a second; the guest sends commands
   (deploy / upgrade / sell / send wave / repair) back up.
   Because only one machine simulates, the two screens can never
   drift apart the way lockstep peer-to-peer eventually does.
   ============================================================ */
const MP = {
  on:false,          // a two-player match is running
  role:null,         // 'host' | 'client' | null
  code:'',
  actor:0,           // host side: 0 = host acted, 1 = guest acted
  me:0,              // 0 = P1 (host), 1 = P2 (guest)
  partner:false,     // partner currently connected
  acc:0,             // snapshot timer
  eMap:new Map(), tMap:new Map(),
  fxQ:[], evQ:[],    // cosmetic effects / gore events pending send
  wantSel:0, lastRx:0, lastTx:0,
};
const ETYPES = Object.keys(ENEMIES).concat(['boss','van']);
/* the buzzer belongs to whoever actually clicked */
const _nope=SFX.nope;
SFX.nope=()=>{ if(MP.on && MP.role==='host' && MP.actor===1) return; _nope(); };
const TGTS   = ['first','last','close','strong'];
const OWNCOL = ['#3fa9ff','#ffcc4d'];
function newCode(){
  const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let s='';
  for(let i=0;i<5;i++) s+=A[Math.floor(Math.random()*A.length)];
  return s;
}

/* ------------------------------------------------------------
   TRANSPORT
   Two paths are opened at once and the first one to land wins:
     • BroadcastChannel — two tabs/windows on the same computer.
       Always available, needs no internet at all.
     • WebRTC via PeerJS — two computers anywhere. Needs the net.
   ------------------------------------------------------------ */
const NET = {
  ch:null, peer:null, conn:null, link:null, open:false,
  onMsg:()=>{}, onOpen:()=>{}, onStatus:()=>{}, onClose:()=>{},
  send(m){
    if(!this.open) return;
    try{
      if(this.link==='bc') this.ch.postMessage({p:m});
      else if(this.conn && this.conn.open) this.conn.send(m);
    }catch(e){}
  },
  teardown(){
    this.open=false; this.link=null;
    try{ manualReset(); }catch(e){}
    try{ this.ch && this.ch.close(); }catch(e){}
    try{ this.conn && this.conn.close(); }catch(e){}
    try{ this.peer && this.peer.destroy(); }catch(e){}
    this.ch=this.conn=this.peer=null;
  }
};
let peerLibP=null;
function loadPeerLib(){
  /* PeerJS is vendored into this file, so there is nothing to fetch and nothing
     to fail. Kept promise-shaped because both callers await it. */
  if(!peerLibP) peerLibP = window.Peer
    ? Promise.resolve(window.Peer)
    : Promise.reject(new Error('networking library missing from this build'));
  return peerLibP;
}
const peerId=code=>'swatraiders-b22-'+code;

/* ---------- direct link: a hand-carried introduction, no lobby server ----------
   Some hosts (the claude.ai artifact sandbox among them) block the connection to
   the matchmaking server, which kills the five-character code path. WebRTC itself
   still works there — it is only the *introduction* that needs a middleman. So
   this path makes the players the middleman: each side produces one blob saying
   how to reach it, they carry those blobs to each other by whatever chat they
   already use, and the media path is negotiated directly from there.

   Caveat worth knowing: with no TURN server to relay through, a pair of strict
   (symmetric) NATs can still fail to meet. Most home connections are fine. */
const ICE = [{urls:'stun:stun.l.google.com:19302'},
             {urls:'stun:stun1.l.google.com:19302'}];

/* Codes travel through chat apps, so they are deflated and made URL-safe.
   CompressionStream is recent; without it the code still works, just longer. */
async function packCode(obj){
  const raw = new TextEncoder().encode(JSON.stringify(obj));
  let bytes = raw;
  if(window.CompressionStream){
    try{
      const cs=new CompressionStream('deflate-raw');
      const w=cs.writable.getWriter(); w.write(raw); w.close();
      bytes=new Uint8Array(await new Response(cs.readable).arrayBuffer());
    }catch(e){ bytes=raw; }
  }
  let bin=''; for(const b of bytes) bin+=String.fromCharCode(b);
  const tag = bytes===raw ? 'R' : 'Z';
  return tag + btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
async function unpackCode(code){
  const clean=String(code).trim().replace(/\s+/g,'');
  const tag=clean[0], b64=clean.slice(1).replace(/-/g,'+').replace(/_/g,'/');
  const bin=atob(b64), bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  let out=bytes;
  if(tag==='Z'){
    const ds=new DecompressionStream('deflate-raw');
    const w=ds.writable.getWriter(); w.write(bytes); w.close();
    out=new Uint8Array(await new Response(ds.readable).arrayBuffer());
  }
  return JSON.parse(new TextDecoder().decode(out));
}
/* One blob per side means waiting for the full candidate list before handing it
   over — trickle would need a live channel, which is the thing we do not have. */
function iceSettled(pc, ms=6000){
  return new Promise(res=>{
    if(pc.iceGatheringState==='complete') return res();
    const t=setTimeout(done, ms);                 // partial list beats no list
    function done(){ clearTimeout(t); pc.removeEventListener('icegatheringstatechange',check); res(); }
    function check(){ if(pc.iceGatheringState==='complete') done(); }
    pc.addEventListener('icegatheringstatechange',check);
  });
}
/* NET.send speaks the PeerJS connection shape, so a raw channel wears that shape. */
function chanAdapter(dc){
  return { get open(){ return dc.readyState==='open'; },
           send(m){ try{ dc.send(JSON.stringify(m)); }catch(e){} },
           close(){ try{ dc.close(); }catch(e){} } };
}
function wireChannel(dc, pc){
  dc.onmessage = ev=>{ if(NET.link==='man'){
    let m; try{ m=JSON.parse(ev.data); }catch(e){ return; } NET.onMsg(m); } };
  dc.onclose = ()=>{ if(NET.link==='man') NET.onClose(); };
  NET.conn = chanAdapter(dc);
  NET.peer = { destroy(){ try{ pc.close(); }catch(e){} } };
}
/* Step 1 for the host: make an invite, then wait to be handed the reply. */
async function manualInvite(){
  const pc=new RTCPeerConnection({iceServers:ICE});
  const dc=pc.createDataChannel('swat',{ordered:true});
  MANUAL.pc=pc; MANUAL.dc=dc;
  dc.onopen=()=>{ if(!NET.open){ wireChannel(dc,pc); netWon('man'); } };
  await pc.setLocalDescription(await pc.createOffer());
  await iceSettled(pc);
  return packCode({t:'o', sdp:pc.localDescription.sdp});
}
async function manualAcceptReply(code){
  const m=await unpackCode(code);
  if(m.t!=='a') throw new Error('That looks like an invite code, not a reply code.');
  await MANUAL.pc.setRemoteDescription({type:'answer', sdp:m.sdp});
}
/* Step 1 for the guest: swallow the invite, produce the reply. */
async function manualAnswer(code){
  const m=await unpackCode(code);
  if(m.t!=='o') throw new Error('That looks like a reply code, not an invite code.');
  const pc=new RTCPeerConnection({iceServers:ICE});
  MANUAL.pc=pc;
  pc.ondatachannel=ev=>{
    const dc=ev.channel; MANUAL.dc=dc;
    const go=()=>{ if(!NET.open){ wireChannel(dc,pc); netWon('man'); } };
    if(dc.readyState==='open') go(); else dc.onopen=go;
  };
  await pc.setRemoteDescription({type:'offer', sdp:m.sdp});
  await pc.setLocalDescription(await pc.createAnswer());
  await iceSettled(pc);
  return packCode({t:'a', sdp:pc.localDescription.sdp});
}
const MANUAL={pc:null, dc:null};
function manualReset(){
  try{ MANUAL.dc && MANUAL.dc.close(); }catch(e){}
  try{ MANUAL.pc && MANUAL.pc.close(); }catch(e){}
  MANUAL.pc=MANUAL.dc=null;
}
function netWon(link){
  if(NET.open) return false;
  NET.open=true; NET.link=link;
  /* the losing path is dead weight now — shut it down */
  if(link==='bc'){ try{ NET.peer && NET.peer.destroy(); }catch(e){} NET.peer=NET.conn=null; }
  else { try{ NET.ch && NET.ch.close(); }catch(e){} NET.ch=null; }
  NET.onOpen(link);
  return true;
}
function netHost(code){
  NET.open=false; NET.link=null;
  try{
    NET.ch=new BroadcastChannel('swatraiders-'+code);
    NET.ch.onmessage=ev=>{
      const m=ev.data||{};
      if(m.hs==='join'){ try{ NET.ch.postMessage({hs:'accept'}); }catch(e){} netWon('bc'); }
      else if(NET.link==='bc' && m.p) NET.onMsg(m.p);
    };
  }catch(e){}
  NET.onStatus('Opening the lobby…');
  loadPeerLib().then(Peer=>{
    if(NET.open) return;
    const p=new Peer(peerId(code),{debug:0});
    NET.peer=p;
    p.on('open',()=>{ if(!NET.open) NET.onStatus('Lobby is live. Give your friend the code.'); });
    p.on('connection',c=>{
      if(NET.open){ try{ c.close(); }catch(e){} return; }
      NET.conn=c;
      c.on('data',d=>{ if(NET.link==='rtc') NET.onMsg(d); });
      c.on('open',()=>{ netWon('rtc'); });
      c.on('close',()=>NET.onClose());
    });
    p.on('error',err=>{
      if(NET.open) return;
      if(err && err.type==='unavailable-id')
        NET.onStatus('That code is already in use — press Back and create another.',true);
      else NET.onStatus('Online lobby unavailable. Same-computer play still works.',true);
    });
  }).catch(()=>{
    if(!NET.open) NET.onStatus('No internet — only same-computer play is available.',true);
  });
}
function netJoin(code){
  NET.open=false; NET.link=null;
  let tries=0;
  try{
    NET.ch=new BroadcastChannel('swatraiders-'+code);
    NET.ch.onmessage=ev=>{
      const m=ev.data||{};
      if(m.hs==='accept'){ netWon('bc'); }
      else if(NET.link==='bc' && m.p) NET.onMsg(m.p);
    };
    const knock=()=>{
      if(NET.open || tries++>40) return;
      try{ NET.ch.postMessage({hs:'join'}); }catch(e){}
      setTimeout(knock,500);
    };
    knock();
  }catch(e){}
  NET.onStatus('Looking for game '+code+'…');
  loadPeerLib().then(Peer=>{
    if(NET.open) return;
    const p=new Peer({debug:0});
    NET.peer=p;
    p.on('open',()=>{
      if(NET.open) return;
      const c=p.connect(peerId(code),{reliable:true});
      NET.conn=c;
      c.on('open',()=>{ netWon('rtc'); });
      c.on('data',d=>{ if(NET.link==='rtc') NET.onMsg(d); });
      c.on('close',()=>NET.onClose());
    });
    p.on('error',err=>{
      if(NET.open) return;
      if(err && err.type==='peer-unavailable')
        NET.onStatus('No game found with code '+code+'. Check the code and try again.',true);
      else NET.onStatus('Could not reach the matchmaking server.',true);
    });
  }).catch(()=>{
    if(!NET.open) NET.onStatus('No internet — the code only works between tabs on this computer.',true);
  });
}

/* both sides land here the instant the link comes up */
function lobbyGo(){
  MP.partner=true;
  MP.lastRx=MP.lastTx=performance.now();
  mpPingStart();
  const where = NET.link==='bc' ? 'same computer' : 'online';
  menuBox(`<div class="mKick">LINK ESTABLISHED</div>
    <h1 style="font-size:32px;background:linear-gradient(180deg,#bdf5cf,#4ade80);-webkit-background-clip:text;-webkit-text-fill-color:transparent">PARTNER FOUND</h1>
    <p>Connected ${where}. You are <b style="color:${OWNCOL[MP.me]}">Player ${MP.me+1}</b>.<br>Rolling the briefing…</p>`);
  setTimeout(()=>startMatch(true),1200);
}
/* Silence is not a slammed door. A tablet that sleeps stops sending for as
   long as it is away, so quiet only means quiet — the match waits, and picks
   up again the moment the partner speaks. Only a genuinely closed connection
   ends things. */
function partnerQuiet(){
  if(!MP.on || !MP.partner) return;
  MP.partner=false; mpBadge();
  if(MP.role==='client'){
    toast('Waiting for Player 1\u2026');
    log('Player 1 has gone quiet. Holding here until they are back.','bad');
  } else {
    toast('Player 2 has gone quiet');
    log('Player 2 has gone quiet \u2014 you are holding the base alone for now.','bad');
  }
}
function partnerBack(){
  if(!MP.on || MP.partner) return;
  MP.partner=true; mpBadge();
  toast('Partner is back'); log('Partner reconnected.','good');
}
function partnerLost(){
  if(!MP.on) return;
  MP.partner=false;
  mpPingStop();
  mpBadge();
  if(MP.role==='client'){
    /* the guest owns none of the simulation, so there is no game left to play */
    G.over=true;
    $('endT').textContent='LINK LOST'; $('endT').style.color='var(--gold)';
    $('endP').innerHTML='Your partner\'s window closed, and with it the battle.<br>'+
      `You held to wave <b>${G.wave}</b> together.`;
    $('ovlEnd').classList.remove('hide');
    return;
  }
  log('Your partner dropped out. You are holding the base alone.','bad');
  toast('Partner disconnected');
}
function startMatch(coop){
  MP.on=!!coop;
  if(coop){ G.cash=300; }
  $('ovlMenu').classList.add('hide');
  $('bSkip').classList.remove('hide');
  G.mode='cut'; CUT.t=0; CUT.done=false; last=performance.now();
  mpBadge();
  syncHUD(); renderShop(); renderSel();
  if(coop) log(`Co-op link up — you are <b style="color:${OWNCOL[MP.me]}">Player ${MP.me+1}</b>. Funds and ground are shared.`,'good');
}
function mpBadge(){
  setTimeout(fitStage,0);
  const w=$('hMP');
  if(!MP.on){ w.style.display='none'; return; }
  w.style.display='flex';
  $('hMPv').innerHTML = MP.partner
    ? `<span style="color:${OWNCOL[MP.me]}">P${MP.me+1}</span> <span style="color:var(--dim)">+</span> <span style="color:${OWNCOL[1-MP.me]}">P${2-MP.me}</span>`
    : `<span style="color:var(--red)">P${MP.me+1} solo</span>`;
}

/* ------------------------------------------------------------
   HOST: build + ship snapshots
   ------------------------------------------------------------ */
function mpSnap(){
  const T=G.time;
  const en=[];
  for(const e of G.enemies){
    if(!e.alive) continue;
    let f=0;
    if(e.flee) f|=1; if(e.redEyes) f|=2; if(e.stealth) f|=4;
    if(e.slowU>T) f|=8; if(e.burnU>T) f|=16; if(e.stunU>T) f|=32;
    if(e.markU>T) f|=64; if(e.flash>T) f|=128;
    en.push([e.id, ETYPES.indexOf(e.type), Math.round(e.d*10)/10, Math.round(e.hp),
             Math.round(e.max), Math.round(e.off*10)/10, e.k||0,
             Math.round(e.base*10)/10, f]);
  }
  const tw=[];
  for(const t of G.towers){
    tw.push([t.id, TKEYS.indexOf(t.key), t.cx, t.cy, Math.round(t.ang*100)/100,
             t.up[0], t.up[1], t.disabled>T?1:0, Math.round((t.flash||0)*10)/10,
             t.spent, t.kills, t.owner|0, TGTS.indexOf(t.target)]);
  }
  const bl=[];
  for(const b of G.bullets) bl.push([Math.round(b.x),Math.round(b.y),Math.round(b.tx),Math.round(b.ty),b.arc?1:0]);
  const ar=[];
  for(const a of G.army) if(a.x!==undefined)
    ar.push([Math.round(a.x),Math.round(a.y),Math.round(a.ang*100)/100,a.dog?(a.back?2:1):0]);
  const sk=[];
  for(const st of G.strips) sk.push([Math.round(st.x),Math.round(st.y),Math.round(st.ang*100)/100]);
  const s={k:'s', t:T, $:Math.round(G.cash), i:Math.round(G.integ*10)/10, w:G.wave,
    r:G.running?1:0, o:G.over?1:0, pz:G.paused?1:0, sp:G.speed,
    ki:G.kills, lk:G.leaked, rp:G.repairs, be:G.bossEsc,
    gd:G.globalDetect?1:0, e:en, u:tw, b:bl, a:ar, sk:sk,
    bs: (G.boss&&G.boss.alive)?[Math.round(G.boss.hp),Math.round(G.boss.max),G.boss.k]:null};
  if(MP.fxQ.length){ s.f=MP.fxQ; MP.fxQ=[]; }
  if(MP.evQ.length){ s.v=MP.evQ; MP.evQ=[]; }
  return s;
}
/* Called from the frame loop on both sides: keep the link warm and notice a
   partner who has closed their window. BroadcastChannel gives us no close
   event, so silence is the only signal there is. */
function mpHeartbeat(){
  if(!MP.on || !NET.open) return;
  const now=performance.now();
  if(now-MP.lastTx>2000){ MP.lastTx=now; NET.send({k:'ping'}); }
  if(MP.partner && now-MP.lastRx>15000) partnerQuiet();
}
/* The frame loop is not a reliable clock: a backgrounded tab — an iPad that
   went to the home screen, a phone that locked — stops animating, and the
   pings would stop with it. A timer keeps beating where frames do not. */
let mpPing=null;
function mpPingStart(){ clearInterval(mpPing); mpPing=setInterval(mpHeartbeat,2000); }
function mpPingStop(){ clearInterval(mpPing); mpPing=null; }
function mpHostSend(dt){
  if(!MP.on||MP.role!=='host'||!NET.open) return;
  MP.acc+=dt;
  if(MP.acc<0.05) return;
  MP.acc=0;
  MP.lastTx=performance.now();
  NET.send(mpSnap());
}
function hostRecv(m){
  MP.lastRx=performance.now(); partnerBack();
  if(!m||MP.role!=='host') return;
  if(m.k==='ping') return;
  MP.actor=1;
  try{
    switch(m.k){
      case 'place': tryPlace(m.c,m.r,m.key); break;
      case 'up':    { const t=G.towers.find(x=>x.id===m.id); if(t) buyUp(m.p,t); } break;
      case 'sell':  { const t=G.towers.find(x=>x.id===m.id); if(t) sellSel(t); } break;
      case 'tgt':   { const t=G.towers.find(x=>x.id===m.id); if(t) t.target=m.v; } break;
      case 'wave':  startWave(); break;
      case 'rep':   doRepair(); break;
      case 'pause': G.paused=!!m.v; $('bPause').textContent=G.paused?'▶':'⏸';
                    $('bPause').classList.toggle('on',G.paused); break;
      case 'speed': G.speed=m.v; $('bSpeed').textContent=G.speed+'×';
                    $('bSpeed').classList.toggle('on',G.speed!==1); break;
      case 'chat':  log('<b style="color:'+OWNCOL[1]+'">P2:</b> '+m.m); break;
    }
  }catch(e){ console.error(e); }
  MP.actor=0;
}

/* ------------------------------------------------------------
   GUEST: consume snapshots, render, send commands
   ------------------------------------------------------------ */
function clientRecv(m){
  MP.lastRx=performance.now(); partnerBack();
  if(!m||MP.role!=='client') return;
  if(m.k==='ping') return;
  if(m.k==='s') mpApply(m);
  else if(m.k==='log') log(m.m,m.c);
  else if(m.k==='toast'){ toast(m.m); if(m.n) SFX.nope(); }
  else if(m.k==='taunt'){ playVO(m.v,'BEN'); toast('BBB: '+m.t); }
  else if(m.k==='sel'){ MP.wantSel=m.id; mpTakeSel(); }
  else if(m.k==='end'){ $('endT').textContent=m.t; $('endT').style.color=m.c;
    $('endP').innerHTML=m.p; $('ovlEnd').classList.remove('hide'); }
}
/* the host confirms our new unit before the snapshot carrying it arrives */
function mpTakeSel(){
  if(!MP.wantSel) return;
  const t=G.towers.find(x=>x.id===MP.wantSel);
  if(!t) return;
  MP.wantSel=0; G.sel=t; renderSel(); renderShop();
}
function mpEnemy(row){
  const [id,ti,d,hp,max,off,k,base,f]=row;
  const type=ETYPES[ti];
  let e=MP.eMap.get(id);
  if(!e){
    const def = type==='boss' ? BOSS : (ENEMIES[type]||ENEMIES.thug);
    e={id,type,def,name:def.name,alive:true,d,dT:d,off,hp,max,base,
       r:(type==='boss'?BOSS.r+k:def.r), col:def.col, boss:type==='boss', k,
       slow:0,slowU:0,burnU:0,stunU:0,markU:0,markMul:1,flash:0,flee:false,
       stealth:false,redEyes:false,wob:Math.random()*6,ph:Math.random(),leak:def.dmg,gold:def.gold};
    MP.eMap.set(id,e);
  } else if(hp < e.hp && G.gore && Math.random()<.5){
    const p=epos(e);
    bloodBurst(p.x+rnd(-4,4), p.y-rnd(8,26), e.boss?4:2, undefined, e.boss?1.4:1);
  }
  e.dT=d; e.hp=hp; e.max=max; e.off=off; e.base=base;
  e.flee   = !!(f&1); e.redEyes=!!(f&2); e.stealth=!!(f&4);
  e.slow   = (f&8)?0.4:0;
  e.slowU  = (f&8)?G.time+1:0;
  e.burnU  = (f&16)?G.time+1:0;
  e.stunU  = (f&32)?G.time+1:0;
  e.markU  = (f&64)?G.time+1:0;
  e.flash  = (f&128)?G.time+.1:0;
  if(Math.abs(e.dT-e.d)>60) e.d=e.dT;      // teleport rather than slide on a big jump
  return e;
}
function mpTower(row){
  const [id,ki,cx,cy,ang,u0,u1,dis,fl,spent,kills,owner,tgi]=row;
  const key=TKEYS[ki];
  let t=MP.tMap.get(id);
  if(!t){ t=makeTower(key,cx,cy); t.id=id; MP.tMap.set(id,t); }
  if(fl>0.5 && (t.flash||0)<=0.1){        // rising muzzle flash: fake the local flourish
    const mx=t.x+Math.cos(ang)*20, my=t.y-22+Math.sin(ang)*20;
    for(let i=0;i<2;i++) part(mx,my,Math.cos(ang)*rnd(20,60)+rnd(-20,20),Math.sin(ang)*20-rnd(10,40),rnd(.25,.5),'#6a6255',rnd(1,2),'smoke');
    part(t.x-Math.cos(ang)*4,t.y-22,-Math.cos(ang)*rnd(30,60),-rnd(30,60),rnd(.5,.9),'#d9b45a',1.1,'brass');
    SFX.shot();
  }
  t.ang=ang; t.flash=fl; t.spent=spent; t.kills=kills; t.owner=owner;
  t.target=TGTS[tgi]||'first'; t.disabled = dis?G.time+1:0;
  if(t.up[0]!==u0||t.up[1]!==u1){ t.up[0]=u0; t.up[1]=u1; recalc(t); }
  return t;
}
function mpApply(s){
  G.time=s.t;
  const dropped = s.i < G.integ - 0.01;
  G.cash=s.$; G.integ=s.i; G.wave=s.w; G.running=!!s.r;
  G.kills=s.ki; G.leaked=s.lk; G.repairs=s.rp; G.bossEsc=s.be; G.globalDetect=!!s.gd;
  G.queue.length = G.running?1:0;
  if(dropped) SFX.leak();
  if(G.paused!==!!s.pz){ G.paused=!!s.pz;
    $('bPause').textContent=G.paused?'▶':'⏸'; $('bPause').classList.toggle('on',G.paused); }
  if(G.speed!==s.sp){ G.speed=s.sp;
    $('bSpeed').textContent=G.speed+'×'; $('bSpeed').classList.toggle('on',G.speed!==1); }
  G.over=!!s.o;

  /* enemies */
  const seen=new Set();
  const list=[];
  for(const row of s.e){ const e=mpEnemy(row); seen.add(e.id); list.push(e); }
  for(const id of Array.from(MP.eMap.keys())) if(!seen.has(id)) MP.eMap.delete(id);
  G.enemies=list;
  G.boss=null;
  if(s.bs){ const b=list.find(e=>e.boss); if(b){ b.hp=s.bs[0]; b.max=s.bs[1]; b.k=s.bs[2]; G.boss=b; } }

  /* towers */
  const tseen=new Set(); const tl=[];
  for(const row of s.u){ const t=mpTower(row); tseen.add(t.id); tl.push(t); }
  for(const id of Array.from(MP.tMap.keys())) if(!tseen.has(id)) MP.tMap.delete(id);
  if(G.sel && !tseen.has(G.sel.id)){ G.sel=null; renderSel(); }
  G.towers=tl;

  /* bullets — reuse the array so the lerp has something to slide from */
  for(let i=0;i<s.b.length;i++){
    const r=s.b[i]; let b=G.bullets[i];
    if(!b){ b={x:r[0],y:r[1],tx:r[2],ty:r[3],src:{arc:!!r[4]},arc:!!r[4]}; G.bullets[i]=b; }
    b.nx=r[0]; b.ny=r[1]; b.tx=r[2]; b.ty=r[3]; b.arc=!!r[4]; b.src.arc=!!r[4];
    if(Math.hypot(b.nx-b.x,b.ny-b.y)>140){ b.x=b.nx; b.y=b.ny; }
  }
  G.bullets.length=s.b.length;

  /* army men */
  for(let i=0;i<s.a.length;i++){
    const r=s.a[i]; let a=G.army[i];
    if(!a){ a={x:r[0],y:r[1],ang:r[2],ph:Math.random()}; G.army[i]=a; }
    a.x=r[0]; a.y=r[1]; a.ang=r[2]; a.dog=r[3]>0; a.back=r[3]===2;
  }
  G.army.length=s.a.length;

  /* spike strips — the guest only ever draws them */
  G.strips = (s.sk||[]).map(r=>({x:r[0],y:r[1],ang:r[2],left:1,max:1}));

  /* cosmetic effects the host generated */
  if(s.f) for(const f of s.f){
    if(f.type==='pool') f.dps=0;
    G.fx.push(f);
    if(f.type==='boom') SFX.boom();
  }
  if(s.v) for(const v of s.v) mpGore(v);
  applyBuffs();
  mpTakeSel();
  syncHUD();
}
/* [x, y, typeIndex, boss] — replay the death dressing locally */
function mpGore(v){
  const [x,y,ti,boss]=v, type=ETYPES[ti];
  if(type==='van'){
    for(let i=0;i<14;i++) part(x,y,rnd(-70,70),rnd(-110,-20),rnd(.5,1.2),'#3a3a3a',rnd(2,5),'smoke');
    splat(x,y,5,undefined,'rgba(30,26,22,'); return;
  }
  const look=LOOK[type]||LOOK.thug;
  corpse(x,y+(boss?10:6),look,boss?1.2:1);
  bloodBurst(x,y-18,boss?26:12,undefined,1.5);
  for(let i=0;i<3;i++) part(x,y-20,rnd(-30,30),rnd(-40,-10),rnd(.4,.9),'#5a5148',rnd(1.5,3),'smoke');
}
function mpClientTick(dt){
  if(G.paused||G.over){ updateFx(0); return; }
  const step=dt*G.speed;
  G.time+=step;
  const k=Math.min(1,step*14);
  for(const e of G.enemies) if(e.dT!==undefined) e.d += (e.dT-e.d)*k;
  for(const b of G.bullets) if(b.nx!==undefined){ b.x+=(b.nx-b.x)*k; b.y+=(b.ny-b.y)*k; }
  updateFx(step); updateParts(step);
}

   The canvas is wiped once and left alone until a mode is chosen. */
let menuPainted=false;
function drawMenuBg(){
  if(menuPainted) return;
  menuPainted=true;
  X.setTransform(1,0,0,1,0,0);
  X.fillStyle='#05080c'; X.fillRect(0,0,W,H);
}

/* ============================================================
   WIN / LOSE
   ============================================================ */
function lose(){
  if(G.over) return; G.over=true; G.running=false; G.integ=0;
  $('endT').textContent='BASE LOST'; $('endT').style.color='var(--red)';
  $('endP').innerHTML=`The Super Duper Secret CIA Base fell on wave <b>${G.wave}</b>.<br>
    ${G.kills.toLocaleString()} hostiles neutralised · Ben escaped ${G.bossEsc} time${G.bossEsc===1?'':'s'}.`;
  $('ovlEnd').classList.remove('hide'); syncHUD(); mpMirrorEnd();
}
function win(){
  if(G.over) return; G.over=true; G.running=false;
  $('endT').textContent='BEN IS DOWN'; $('endT').style.color='var(--grn)';
  $('endP').innerHTML=`Fifty waves held. Baddy Boss Ben will not be coming back.<br>
    ${G.kills.toLocaleString()} hostiles neutralised · <b>${Math.ceil(G.integ)}</b> health remaining.`;
  $('ovlEnd').classList.remove('hide'); syncHUD(); mpMirrorEnd();
}
function mpMirrorEnd(){
  if(MP.on && MP.role==='host' && NET.open)
    NET.send({k:'end',t:$('endT').textContent,c:$('endT').style.color,p:$('endP').innerHTML});
}

   LOOP + INPUT
   ============================================================ */
let last=performance.now(), uiT=0, lastCash=-1, frameErr=0;
function showFault(e){
  if(frameErr++) return;
  const o=document.getElementById('ovlCut');
  o.style.background='rgba(5,8,12,.92)'; o.classList.remove('hide');
  o.innerHTML='<div style="max-width:560px"><h1 style="font-size:26px;color:#ff4d5e">Something broke</h1>'+
    '<p style="font-family:monospace;font-size:12px;color:#dfe7f2;word-break:break-word">'+
    String(e && (e.stack||e.message||e))+'</p>'+
    '<p>Please send me this message and I will fix it.</p>'+
    '<button class="go" style="padding:10px 22px" onclick="location.reload()">Reload</button></div>';
}
let framesRun=0;
/* Only complain if the page is actually on screen and still not drawing —
   a hidden or background tab legitimately runs no animation frames. */
function loopWatchdog(strikes){
  if(framesRun>=2) return;                       // it's alive, nothing to report
  if(document.hidden || strikes<6){ setTimeout(()=>loopWatchdog(strikes+1),1500); return; }
  showFault('The animation loop never started, so the game is frozen. '+
    'Your browser may be too old for this game — try Chrome, or update Safari.');
}
setTimeout(()=>loopWatchdog(0),2500);
/* ---------- background heartbeat ----------
   Browsers stop handing out animation frames to a hidden tab. On your own that
   just means the game politely pauses — but in co-op it would freeze your
   partner's screen too, so while we are hosting we keep the simulation moving
   off a timer and go on shipping snapshots. */
let hbLast=performance.now();
setInterval(()=>{
  const now=performance.now();
  mpHeartbeat();                           // pings and the drop-out watchdog run either way
  if(!document.hidden || G.mode==='menu' || MP.role!=='host' || !MP.on){ hbLast=now; return; }
  let dt=(now-hbLast)/1000; hbLast=now;
  if(dt<=0) return;
  dt=Math.min(dt,2);                       // never try to swallow more than 2s in one go
  if(G.mode==='cut') CUT.t+=dt;
  try{ stepSim(dt); MP.acc=1; mpHostSend(0); mpHeartbeat(); }catch(e){ console.error(e); }
},200);
function frame(now){
  framesRun++;
  try{ frameBody(now); }
  catch(err){ console.error(err); showFault(err); }
  requestAnimationFrame(frame);
}
function stepSim(dt){
  if(G.paused || G.over) return;
  let total=dt*G.speed;
  while(total>0){
    const s=Math.min(total,1/60); total-=s; G.time+=s;
    updateWave(s); updateTowers(s); updateBullets(s); updateArmy(s); updateStrips(); updateEnemies(s); updateFx(s); updateParts(s);
    if(G.over) break;
  }
}
function frameBody(now){
  hbLast=now;                       // the animation loop is alive; the heartbeat stands down
  let dt=(now-last)/1000; last=now; dt=Math.min(dt,.05);
  if(G.mode==='menu'){ drawMenuBg(); return; }
  /* The host keeps simulating behind its own briefing, otherwise the guest's
     screen would freeze while P1 watches the cutscene. */
  if(G.mode==='cut'){
    CUT.t+=dt; drawCut(dt);
    if(MP.role==='host'){ stepSim(dt); mpHostSend(dt); }
    else if(MP.role==='client') mpClientTick(dt);
    mpHeartbeat();
    return;
  }
  if(MP.role==='client') mpClientTick(dt);
  else { stepSim(dt); mpHostSend(dt); }
  mpHeartbeat();
  updateCam(dt);
  render(); syncHUD();
  uiT+=dt;
  if(uiT>0.25){ uiT=0; const c=Math.floor(G.cash);
    if(c!==lastCash){ lastCash=c; renderShop(); renderSel(); } }
}
function screenPos(ev){
  const r=CV.getBoundingClientRect();
  return {x:(ev.clientX-r.left)*(W/r.width), y:(ev.clientY-r.top)*(H/r.height)};
}
function mouseCell(ev){
  const sp=screenPos(ev), w=s2w(sp.x,sp.y);
  G.mouse=w; return cellAt(w.x,w.y);
}
CV.addEventListener('mousemove',e=>{
  if(G.mode!=='play')return;
  if(CAM.drag){
    const sp=screenPos(e);
    CAM.x -= (sp.x-CAM.drag.x)/CAM.z; CAM.y -= (sp.y-CAM.drag.y)/CAM.z;
    CAM.moved += Math.abs(sp.x-CAM.drag.x)+Math.abs(sp.y-CAM.drag.y);
    CAM.drag=sp; CAM.follow=false; camClamp();
  }
  G.screen=screenPos(e);
  G.hover=mouseCell(e);
});
CV.addEventListener('mousedown',e=>{ if(e.button===2||e.button===1){ CAM.drag=screenPos(e); CAM.moved=0; } });
addEventListener('mouseup',()=>{ CAM.drag=null; });
CV.addEventListener('wheel',e=>{
  e.preventDefault();
  CAM.userZ = clamp(CAM.userZ * (e.deltaY>0?0.86:1.16), 1, 3.4);
  if(!G.place) CAM.follow = CAM.userZ<1.15 ? CAM.follow : CAM.follow;
},{passive:false});
CV.addEventListener('mouseleave',()=>G.hover=null);
CV.addEventListener('contextmenu',e=>{ e.preventDefault();
  if(CAM.moved>6){ CAM.moved=0; return; }
  G.place=null; G.sel=null; renderShop(); renderSel(); });
/* One primary action — the thing a left click or a tap means. Both callers
   hand in something with clientX/clientY, so a Touch works as well as a mouse
   event does. */
function primaryAt(pt){
  if(G.mode==='menu') return;
  if(G.mode==='cut'){ skipCut(); return; }
  if(G.over) return;
  const sp=screenPos(pt), wb=waveBtnRect();
  if(sp.x>=wb.x&&sp.x<=wb.x+wb.w&&sp.y>=wb.y&&sp.y<=wb.y+wb.h){
    if(G.running){ SFX.nope(); toast('Wave '+G.wave+' is still in progress'); }
    else startWave();
    return; }
  const {c,r}=mouseCell(pt);
  if(G.place){ tryPlace(c,r); return; }
  const hit=G.towers.find(t=>t.cx===c&&t.cy===r);
  G.sel = hit||null; renderSel(); renderShop();
}
CV.addEventListener('click',e=>{ if(TCH.recent) return; primaryAt(e); });

/* ------------------------------------------------------------
   TOUCH  —  iPad and phone
   A tablet has no right button, no wheel and no keyboard, so the
   same four verbs are rebuilt out of fingers:
     tap            act (deploy / select / send wave)
     one-finger drag  pan
     two-finger pinch zoom
     long press     cancel placement or selection
   Every handler calls preventDefault, which is also what stops
   Safari from firing a ghost click 300ms later and acting twice.
   ------------------------------------------------------------ */
const TCH={last:null,moved:0,t0:0,press:null,pinch:null,recent:false};
const TAP_SLOP=12;                     // finger wobble that still counts as a tap
function tapCancel(){
  if(!G.place && !G.sel) return;
  G.place=null; G.sel=null; renderShop(); renderSel(); toast('Cancelled');
}
CV.addEventListener('touchstart',e=>{
  e.preventDefault();
  clearTimeout(TCH.press);
  if(e.touches.length===1){
    const t=e.touches[0];
    TCH.last=screenPos(t); TCH.moved=0; TCH.t0=performance.now(); TCH.pinch=null;
    if(G.mode==='play'){ G.screen=TCH.last; G.hover=mouseCell(t); }
    TCH.press=setTimeout(()=>{
      if(TCH.moved<=TAP_SLOP && G.mode==='play'){ TCH.moved=1e4; tapCancel(); }
    },600);
  } else if(e.touches.length===2){
    const a=screenPos(e.touches[0]), b=screenPos(e.touches[1]);
    TCH.pinch={d:Math.hypot(a.x-b.x,a.y-b.y)||1, z:CAM.userZ};
    TCH.moved=1e4;                     // a second finger means this was never a tap
  }
},{passive:false});
CV.addEventListener('touchmove',e=>{
  e.preventDefault();
  if(G.mode!=='play') return;
  if(TCH.pinch && e.touches.length>=2){
    const a=screenPos(e.touches[0]), b=screenPos(e.touches[1]);
    const d=Math.hypot(a.x-b.x,a.y-b.y)||1;
    CAM.userZ=clamp(TCH.pinch.z*(d/TCH.pinch.d),1,3.4);
  } else if(e.touches.length===1 && TCH.last){
    const t=e.touches[0], p=screenPos(t);
    const dx=p.x-TCH.last.x, dy=p.y-TCH.last.y;
    TCH.moved+=Math.abs(dx)+Math.abs(dy);
    if(TCH.moved>TAP_SLOP){
      CAM.x-=dx/CAM.z; CAM.y-=dy/CAM.z; CAM.follow=false; camClamp();
    }
    TCH.last=p; G.screen=p; G.hover=mouseCell(t);
  }
},{passive:false});
const touchEnd=e=>{
  e.preventDefault();
  clearTimeout(TCH.press);
  if(e.touches.length) return;                       // fingers still down
  const t=e.changedTouches&&e.changedTouches[0];
  const quick=performance.now()-TCH.t0<600;
  if(t && TCH.moved<=TAP_SLOP && quick) primaryAt(t);
  TCH.pinch=null; TCH.last=null;
  TCH.recent=true; setTimeout(()=>{TCH.recent=false;},700);
};
CV.addEventListener('touchend',touchEnd,{passive:false});
CV.addEventListener('touchcancel',e=>{ clearTimeout(TCH.press); TCH.pinch=null; TCH.last=null; },{passive:false});
/* Safari zooms the whole page on a pinch unless the canvas objects */
['gesturestart','gesturechange','gestureend'].forEach(g=>
  CV.addEventListener(g,e=>e.preventDefault(),{passive:false}));
addEventListener('keydown',e=>{
  const tag=(e.target&&e.target.tagName)||'';
  if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT') return;   // let the lobby code field type
  const k=e.key.toLowerCase();
  if(G.mode==='menu') return;
  if(G.mode==='cut'){ if(k===' '||k==='escape'||k==='enter') { e.preventDefault(); skipCut(); } return; }
  if(k>='1'&&k<='9'&&+k<=TKEYS.length){ const key=TKEYS[+k-1]; G.place=G.place===key?null:key; G.sel=null; renderShop(); renderSel(); }
  else if(k==='escape'){ G.place=null; G.sel=null; renderShop(); renderSel(); }
  else if(k===' '){ e.preventDefault(); startWave(); }
  else if(k==='s'&&G.sel){ sellSel(); }
  else if(k==='p'){ togglePause(); }
  else if(k==='r'){ doRepair(); }
  else if(k==='f'){ CAM.follow=!CAM.follow; $('bCam').classList.toggle('on',CAM.follow);
                    toast('Auto-camera '+(CAM.follow?'on':'off')); }
  else if(k==='w'||k==='arrowup'){ CAM.y-=48/CAM.z*2; CAM.follow=false; camClamp(); }
  else if(k==='a'||k==='arrowleft'){ CAM.x-=48/CAM.z*2; CAM.follow=false; camClamp(); }
  else if(k==='d'||k==='arrowright'){ CAM.x+=48/CAM.z*2; CAM.follow=false; camClamp(); }
  else if(k==='x'||k==='arrowdown'){ CAM.y+=48/CAM.z*2; CAM.follow=false; camClamp(); }
});
function togglePause(){
  if(MP.role==='client') NET.send({k:'pause',v:!G.paused});
  G.paused=!G.paused; $('bPause').textContent=G.paused?'▶':'⏸'; $('bPause').classList.toggle('on',G.paused); }
$('bSkip').onclick=skipCut;
$('bStart').onclick=startWave;
$('bRepair').onclick=doRepair;
$('bGore').onclick=()=>{ G.gore=!G.gore; $('bGore').textContent=G.gore?'🩸':'🚫';
  $('bGore').classList.toggle('on',!G.gore); toast('Blood '+(G.gore?'on':'off')); };
$('bPause').onclick=togglePause;
$('bSpeed').onclick=()=>{ const v = G.speed===1?2:G.speed===2?3:1;
  if(MP.role==='client') NET.send({k:'speed',v});
  G.speed=v; $('bSpeed').textContent=G.speed+'×';
  $('bSpeed').classList.toggle('on',G.speed!==1); };
$('bSound').onclick=()=>{ sndOn=!sndOn; $('bSound').textContent=sndOn?'🔊':'🔇';
  if(sndOn){ audioWarned=false; unlockAudio(); } else shutUp(); };
$('bAgain').onclick=()=>location.reload();
$('bCam').onclick=()=>{ CAM.follow=!CAM.follow; $('bCam').classList.toggle('on',CAM.follow);
  toast('Auto-camera '+(CAM.follow?'on':'off')); };
/* keyboard shortcuts are a lie on a tablet — say what the fingers do instead */
if(matchMedia('(pointer:coarse)').matches){
  const h=$('hint');
  if(h) h.innerHTML='Tap a unit, then tap the ground &middot; tap a deployed unit to upgrade &middot; '+
                    'drag to pan &middot; pinch to zoom &middot; long-press to cancel';
}

const BUILD='25';
setTimeout(()=>{ loadVO(); unlockAudio(); },60);
addEventListener('error',e=>showFault(e.error||e.message));
log(`SWAT Raiders build <b>${BUILD}</b> loaded.`);
renderShop(); renderSel(); syncHUD();
fitStage(); setTimeout(fitStage,120);
showMenu();
requestAnimationFrame(frame);
</script>
</body>
</html>
